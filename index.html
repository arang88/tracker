<body>
<div class="login-page" id="loginPage"><div class="login-card"><div class="lc-icon">🔐</div><h1 id="loginTitle">Budget Tracker</h1><p class="lc-sub" id="loginSub"></p><div class="lc-error" id="loginError"></div><div class="lc-success" id="loginSuccess"></div><div id="loginForm"></div><div class="login-footer" id="loginFooter">🔒 Data dilindungi</div></div></div>
<div class="app-container" id="appContainer">
<header><div class="header-row"><div class="header-left"><button class="hamburger" onclick="toggleDrawer()">☰</button><h1 id="headerTitle">🏠 Budget Tracker</h1></div><div class="header-right"><span class="sync-badge offline" id="syncBadge" onclick="manualSync()">☁️ —</span><button class="btn-lock" onclick="lockApp()">🔒</button><div class="lang-toggle"><button id="langBM" class="active" onclick="setLang('bm')">BM</button><button id="langEN" onclick="setLang('en')">EN</button></div><div class="active-tab-indicator" onclick="toggleDrawer()" id="activeTabLabel"></div><div class="month-sel"><select id="monthSelect" onchange="changeMonth(this.value)"></select></div></div></div></header>
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"><div class="drawer-header"><h2 id="drawerTitle">🏠 Menu</h2><button class="drawer-close" onclick="closeDrawer()">✕</button></div><div class="drawer-nav" id="drawerNav"></div><div class="drawer-footer" id="drawerFooter"></div></div>
<main id="mainContent"></main></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div>

<script>
// ========== ENCODE/DECODE KEYS ==========
function encodeKeys(obj){if(obj===null||obj===undefined||typeof obj!=='object')return obj;if(Array.isArray(obj))return obj.map(i=>encodeKeys(i));let r={};Object.keys(obj).forEach(k=>{let s=k.replace(/\./g,'%2E').replace(/#/g,'%23').replace(/\$/g,'%24').replace(/\//g,'%2F').replace(/\[/g,'%5B').replace(/\]/g,'%5D');r[s]=encodeKeys(obj[k])});return r}
function decodeKeys(obj){if(obj===null||obj===undefined||typeof obj!=='object')return obj;if(Array.isArray(obj))return obj.map(i=>decodeKeys(i));let r={};Object.keys(obj).forEach(k=>{let o=k.replace(/%2E/g,'.').replace(/%23/g,'#').replace(/%24/g,'$').replace(/%2F/g,'/').replace(/%5B/g,'[').replace(/%5D/g,']');r[o]=decodeKeys(obj[k])});return r}

// ========== FIREBASE ==========
const FB_KEY='hbudget_fb_config';
let fbApp=null,fbDb=null,fbRef=null,fbConn=false,syncTmr=null,isSyncing=false,lastPushTs=0;
function getFbCfg(){try{return JSON.parse(localStorage.getItem(FB_KEY))}catch(e){return null}}
function setFbCfg(c){localStorage.setItem(FB_KEY,JSON.stringify(c))}
function initFirebase(){let cfg=getFbCfg();if(!cfg||!cfg.databaseURL||!cfg.syncId)return;try{if(fbApp){try{fbApp.delete()}catch(e){}}fbApp=firebase.initializeApp({apiKey:cfg.apiKey||'',databaseURL:cfg.databaseURL,projectId:cfg.projectId||''},'ba');fbDb=firebase.database(fbApp);fbRef=fbDb.ref('budgetData/'+cfg.syncId);fbDb.ref('.info/connected').on('value',s=>{fbConn=s.val()===true;uBdg(fbConn?'online':'offline')});fbRef.on('value',s=>{let c=s.val();if(!c||!c.months)return;c=decodeKeys(c);let lT=data._lastSaved||0,cT=c._cloudTs||0;if(cT>lT+3000&&cT!==lastPushTs){data=c;data._lastSaved=cT;if(data.lang)lang=data.lang;safeSave();initMonth(cM);renderActiveTab();uBdg('synced');showToast('☁️ Data synced')}else{uBdg('synced')}});console.log('Firebase ready — Sync ID:',cfg.syncId)}catch(e){console.error('FB err:',e);uBdg('error')}}
function uBdg(s){let el=document.getElementById('syncBadge');if(!el)return;el.className='sync-badge';if(s==='synced'){el.classList.add('synced');el.textContent='☁️ ✅'}else if(s==='syncing'){el.classList.add('syncing');el.textContent='☁️ ...'}else if(s==='online'){el.classList.add('synced');el.textContent='☁️ 🟢'}else if(s==='error'){el.classList.add('error');el.textContent='☁️ ❌'}else{el.classList.add('offline');el.textContent='☁️ —'}}
function pushToCloud(){if(!fbRef||!fbConn||isSyncing)return;let hasData=data.months&&Object.keys(data.months).some(m=>{let md=data.months[m];if(!md)return false;let has=false;['suami','isteri'].forEach(p=>{if(!md[p])return;if(md[p].gaji>0)has=true;Object.values(md[p].perbelanjaan||{}).forEach(a=>{if(Array.isArray(a)&&a.length>0)has=true});Object.values(md[p].komitmen||{}).forEach(a=>{if(Array.isArray(a)&&a.length>0)has=true});Object.values(md[p].wangTambahan||{}).forEach(a=>{if(Array.isArray(a)&&a.length>0)has=true})});return has});if(!hasData){console.log('Skip push — no data');return}isSyncing=true;uBdg('syncing');let p=encodeKeys(JSON.parse(JSON.stringify(data)));let now=Date.now();p._cloudTs=now;lastPushTs=now;data._lastSaved=now;safeSave();fbRef.set(p).then(()=>{uBdg('synced');isSyncing=false}).catch(e=>{console.error('Push err:',e.message);uBdg('error');isSyncing=false})}
function pullFromCloud(){if(!fbRef||isSyncing)return;isSyncing=true;uBdg('syncing');fbRef.once('value').then(s=>{let c=s.val();if(!c||!c.months){isSyncing=false;uBdg('synced');return}c=decodeKeys(c);data=c;data._lastSaved=c._cloudTs||Date.now();if(data.lang)lang=data.lang;safeSave();initMonth(cM);renderActiveTab();uBdg('synced');showToast('☁️ Pulled');isSyncing=false}).catch(e=>{console.error('Pull err:',e);uBdg('error');isSyncing=false})}
function schedPush(){clearTimeout(syncTmr);syncTmr=setTimeout(()=>pushToCloud(),3000)}
function manualSync(){if(!fbRef){showToast('⚠️ Setup Firebase');return}if(!fbConn){showToast('⚠️ Offline');return}pushToCloud();showToast('☁️ Syncing...')}

// ========== AUTH ==========
const AK='hbudget_auth',SSK='hbudget_session';
let inactTmr=null;const LOCK_MIN=15;
function sHash(pw){let s=pw+'_hbudget_2024',h1=5381,h2=52711;for(let i=0;i<s.length;i++){let c=s.charCodeAt(i);h1=(h1*33)^c;h2=(h2*33)^c}return'h'+Math.abs(h1).toString(36)+Math.abs(h2).toString(36)}
function gAuth(){try{return JSON.parse(localStorage.getItem(AK))}catch(e){return null}}
function sAuth(o){localStorage.setItem(AK,JSON.stringify(o))}
function gSess(){try{let s=JSON.parse(localStorage.getItem(SSK));if(s?.expires&&Date.now()>s.expires)return null;return s}catch(e){return null}}
function sSess(r){localStorage.setItem(SSK,JSON.stringify({active:true,expires:Date.now()+(r?604800000:7200000)}))}
function cSess(){localStorage.removeItem(SSK)}
function showLogin(){document.getElementById('loginPage').style.display='flex';document.getElementById('appContainer').classList.remove('show');gAuth()?rLoginForm():rSetupForm()}
function rSetupForm(){document.getElementById('loginTitle').textContent='🔐 Buat Kata Laluan';document.getElementById('loginSub').textContent='Tetapkan kata laluan';document.getElementById('loginForm').innerHTML='<div class="login-input-group"><label>Kata Laluan</label><input type="password" id="sp1" placeholder="Min 4" onkeydown="if(event.key===\'Enter\')document.getElementById(\'sp2\').focus()"><button class="toggle-pw" onclick="tPw(\'sp1\',this)">👁️</button></div><div class="login-input-group"><label>Sahkan</label><input type="password" id="sp2" placeholder="Semula" onkeydown="if(event.key===\'Enter\')doSetup()"><button class="toggle-pw" onclick="tPw(\'sp2\',this)">👁️</button></div><div class="login-remember"><input type="checkbox" id="sr" checked><label for="sr">Ingat 7 hari</label></div><button class="login-btn" onclick="doSetup()">🔐 Masuk</button>';setTimeout(()=>document.getElementById('sp1').focus(),300)}
function rLoginForm(){document.getElementById('loginTitle').textContent='🔐 Budget Tracker';document.getElementById('loginSub').textContent='Masukkan kata laluan';document.getElementById('loginError').classList.remove('show');document.getElementById('loginSuccess').classList.remove('show');document.getElementById('loginForm').innerHTML='<div class="login-input-group"><label>Kata Laluan</label><input type="password" id="lp" placeholder="Kata laluan" onkeydown="if(event.key===\'Enter\')doLogin()"><button class="toggle-pw" onclick="tPw(\'lp\',this)">👁️</button></div><div class="login-remember"><input type="checkbox" id="lr" checked><label for="lr">Ingat 7 hari</label></div><button class="login-btn" onclick="doLogin()">🔓 Masuk</button><div class="login-divider">atau</div><button class="btn btn-outline btn-sm" onclick="doReset()" style="width:100%;justify-content:center;color:var(--red);border-color:var(--red)">🗑️ Reset Semua</button>';setTimeout(()=>document.getElementById('lp').focus(),300)}
function doSetup(){let a=document.getElementById('sp1').value,b=document.getElementById('sp2').value,e=document.getElementById('loginError'),s=document.getElementById('loginSuccess');e.classList.remove('show');s.classList.remove('show');if(a.length<4){e.textContent='⚠️ Min 4';e.classList.add('show');return}if(a!==b){e.textContent='⚠️ Tak sama';e.classList.add('show');return}sAuth({hash:sHash(a)});sSess(document.getElementById('sr').checked);s.textContent='✅ OK!';s.classList.add('show');setTimeout(enterApp,500)}
function doLogin(){let p=document.getElementById('lp').value,e=document.getElementById('loginError');e.classList.remove('show');if(!p){e.textContent='⚠️ Masukkan';e.classList.add('show');return}if(sHash(p)!==gAuth()?.hash){e.textContent='❌ Salah';e.classList.add('show');document.getElementById('lp').value='';return}sSess(document.getElementById('lr').checked);enterApp()}
function doReset(){if(!confirm('⚠️ Padam semua?'))return;if(!confirm('PASTI?'))return;localStorage.removeItem(AK);localStorage.removeItem(SSK);localStorage.removeItem(DK_KEY);localStorage.removeItem(BK_KEY);rSetupForm();document.getElementById('loginSuccess').textContent='🔄 Reset';document.getElementById('loginSuccess').classList.add('show')}
function enterApp(){document.getElementById('loginPage').style.display='none';document.getElementById('appContainer').classList.add('show');startInact();initApp()}
function lockApp(){safeSave();pushToCloud();cSess();stopInact();document.getElementById('appContainer').classList.remove('show');document.getElementById('loginPage').style.display='flex';rLoginForm()}
function tPw(id,b){let i=document.getElementById(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁️':'🙈'}
function startInact(){stopInact();['mousedown','mousemove','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e,resetInact,{passive:true}));resetInact()}
function stopInact(){clearTimeout(inactTmr);['mousedown','mousemove','keydown','touchstart','scroll'].forEach(e=>document.removeEventListener(e,resetInact))}
function resetInact(){clearTimeout(inactTmr);inactTmr=setTimeout(()=>{showToast('🔒 Auto-lock');setTimeout(lockApp,1500)},LOCK_MIN*60000)}
function showChgPw(){openModal('<h3>🔑 Tukar Password</h3><div class="form-group" style="margin-bottom:10px"><label>Semasa</label><input type="password" id="co"></div><div class="form-group" style="margin-bottom:10px"><label>Baru</label><input type="password" id="cn"></div><div class="form-group" style="margin-bottom:10px"><label>Sahkan</label><input type="password" id="cc"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="doChgPw()">💾</button></div>')}
function doChgPw(){let o=document.getElementById('co').value,n=document.getElementById('cn').value,c=document.getElementById('cc').value;if(sHash(o)!==gAuth()?.hash){showToast('❌ Salah');return}if(n.length<4){showToast('⚠️ Min 4');return}if(n!==c){showToast('⚠️ Tak sama');return}sAuth({hash:sHash(n)});closeModal();showToast('✅ Ditukar')}

// ========== DATA ==========
const DK_KEY='hbudget_v10',BK_KEY='hbudget_v10b';
let savTmr=null,isSaving=false,renTmr=null;
function safeSave(){if(isSaving)return;isSaving=true;try{let j=JSON.stringify(data);if(!j||j.length<10){isSaving=false;return}let x=localStorage.getItem(DK_KEY);if(x&&x.length>50)localStorage.setItem(BK_KEY,x);localStorage.setItem(DK_KEY,j)}catch(e){}isSaving=false}

function TT(){return L[lang]}
function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function tISO(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nTm(){let d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function i2d(i){if(!i||i==='-')return'-';let p=i.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:i}
function d2i(d){if(!d||d==='-')return'';let p=d.split('/');return p.length===3?p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0'):''}
function stp(i){return{date:i2d(i||tISO()),time:nTm(),ts:Date.now()}}

// KOMITMEN migration — convert old format to array
function mK(o){if(Array.isArray(o))return o;if(typeof o==='number')return o>0?[{id:gid(),amount:o,nota:'',date:'',time:'',ts:0}]:[];if(typeof o==='object'&&o&&o.amount!==undefined)return o.amount>0?[{id:gid(),amount:o.amount,nota:o.nota||'',date:o.date||'',time:o.time||'',ts:o.ts||0}]:[];return[]}
function mW(o){if(typeof o==='number')return o>0?[{id:gid(),amount:o,nota:'',date:'',time:'',ts:0}]:[];return Array.isArray(o)?o:[]}
function initMonth(m){if(!data.months)data.months={};let n=!data.months[m];if(n)data.months[m]={suami:newP(),isteri:newP()};let md=data.months[m];['suami','isteri'].forEach(p=>{if(!md[p])md[p]=newP();if(!md[p].wangTambahan)md[p].wangTambahan={};WK.forEach(w=>{md[p].wangTambahan[w]=mW(md[p].wangTambahan[w])});if(!md[p].komitmen)md[p].komitmen={};data.categories.komitmen.forEach(k=>{if(md[p].komitmen[k]===undefined)md[p].komitmen[k]=[];else md[p].komitmen[k]=mK(md[p].komitmen[k])});if(!md[p].perbelanjaan)md[p].perbelanjaan={};data.categories.perbelanjaan.forEach(c=>{if(!md[p].perbelanjaan[c])md[p].perbelanjaan[c]=[]})});if(n)saveData()}
function newP(){let p={gaji:0,wangTambahan:{},komitmen:{},perbelanjaan:{}};WK.forEach(w=>p.wangTambahan[w]=[]);data.categories.komitmen.forEach(k=>p.komitmen[k]=[]);data.categories.perbelanjaan.forEach(c=>p.perbelanjaan[c]=[]);return p}
function gd(p){return data.months[cM]?data.months[cM][p||cP]:null}
function kA(o){if(Array.isArray(o))return o.reduce((a,e)=>a+(parseFloat(e.amount)||0),0);if(typeof o==='object'&&o)return parseFloat(o.amount)||0;return parseFloat(o)||0}
function wCT(p,k){let d=gd(p);if(!d||!Array.isArray(d.wangTambahan[k]))return 0;return d.wangTambahan[k].reduce((a,e)=>a+(parseFloat(e.amount)||0),0)}
function tWT(p){let x=0;WK.forEach(w=>x+=wCT(p,w));return x}
function tI(p){let d=gd(p);if(!d)return 0;return(parseFloat(d.gaji)||0)+tWT(p)}
function tK(p){let d=gd(p);if(!d)return 0;let x=0;Object.values(d.komitmen).forEach(arr=>{if(Array.isArray(arr))arr.forEach(e=>x+=(parseFloat(e.amount)||0));else x+=kA(arr)});return x}
function tE(p){let d=gd(p);if(!d)return 0;let x=0;Object.values(d.perbelanjaan).forEach(a=>{if(Array.isArray(a))a.forEach(e=>x+=(parseFloat(e.amount)||0))});return x}
function tEC(p,c){let d=gd(p);if(!d||!d.perbelanjaan[c])return 0;return d.perbelanjaan[c].reduce((a,e)=>a+(parseFloat(e.amount)||0),0)}

// CARRY FORWARD BALANCE
function getBawa(p){let mi=MO.indexOf(cM);if(mi<=0)return 0;let total=0;for(let i=0;i<mi;i++){let m=MO[i];let md=data.months[m];if(!md||!md[p])continue;let d=md[p];let inc=parseFloat(d.gaji)||0;WK.forEach(w=>{(d.wangTambahan[w]||[]).forEach(e=>inc+=(parseFloat(e.amount)||0))});let kom=0;Object.values(d.komitmen||{}).forEach(arr=>{if(Array.isArray(arr))arr.forEach(e=>kom+=(parseFloat(e.amount)||0));else kom+=kA(arr)});let ex=0;Object.values(d.perbelanjaan||{}).forEach(arr=>{if(Array.isArray(arr))arr.forEach(e=>ex+=(parseFloat(e.amount)||0))});total+=inc-kom-ex}return total}
function bal(p){return tI(p)+getBawa(p)-tK(p)-tE(p)}
function rm(v){return'RM '+(parseFloat(v)||0).toFixed(2)}
function pct(v,x){return x?((v/x)*100):0}
function wl(i){return TT().income.cats[i]||WK[i]}
function ci(s){return s.replace(/[^a-zA-Z0-9]/g,'_')}
function escapeHTML(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function esc(s){return s.replace(/'/g,"\\'")}

function editEnt(tp,pr,cat,id){let d=data.months[cM][pr];if(!d)return;let e;if(tp==='wt')e=(d.wangTambahan[cat]||[]).find(x=>x.id===id);else if(tp==='kom')e=(d.komitmen[cat]||[]).find(x=>x.id===id);else e=(d.perbelanjaan[cat]||[]).find(x=>x.id===id);if(!e)return;let E=TT().edit,iso=d2i(e.date)||tISO();openModal('<h3>'+E.title+'</h3><div class="form-group" style="margin-bottom:10px"><label>'+E.amtLabel+'</label><input type="number" id="ea" value="'+e.amount+'" step="0.01"></div><div class="form-group" style="margin-bottom:10px"><label>'+E.notaLabel+'</label><input type="text" id="en" value="'+(e.nota||'')+'"></div><div class="form-group" style="margin-bottom:10px"><label>'+E.dateLabel+'</label><input type="date" id="ed" value="'+iso+'"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">'+E.cancel+'</button><button class="btn btn-primary" onclick="svEd(\''+tp+'\',\''+pr+'\',\''+esc(cat)+'\',\''+id+'\')">'+E.save+'</button></div>')}
function svEd(tp,pr,cat,id){let a=parseFloat(document.getElementById('ea').value),n=document.getElementById('en').value.trim(),dt=document.getElementById('ed').value;if(!a||a<=0){showToast(TT().msg.enterAmount);return}if(!n){showToast(TT().msg.notaRequired);return}let d=data.months[cM][pr];if(!d)return;let arr=tp==='wt'?d.wangTambahan[cat]:tp==='kom'?d.komitmen[cat]:d.perbelanjaan[cat];let e=(arr||[]).find(x=>x.id===id);if(e){e.amount=a;e.nota=n;e.date=i2d(dt);e.time=nTm();e.ts=Date.now()}saveNow();closeModal();showToast(TT().msg.edited);renderActiveTab()}

function exXL(){let rows=gRows(),html='<html><head><meta charset="UTF-8"></head><body><table border="1">';rows.forEach((r,i)=>{html+='<tr>';r.forEach(c=>{html+=(i===0?'<th>':'<td>')+c+(i===0?'</th>':'</td>')});html+='</tr>'});html+='</table></body></html>';dlF(html,'budget_'+cM+'.xls','application/vnd.ms-excel');showToast(TT().msg.exported)}
function exPDF(){try{const{jsPDF}=window.jspdf;let doc=new jsPDF('l');doc.setFontSize(16);doc.text('Budget - '+cM,14,20);let rows=gRows();doc.autoTable({head:[rows[0]],body:rows.slice(1),startY:28,styles:{fontSize:7},headStyles:{fillColor:[46,125,50]}});doc.save('budget_'+cM+'.pdf');showToast(TT().msg.exported)}catch(e){showToast('⚠️ '+e.message)}}
function dlF(c,f,tp){let b=new Blob([c],{type:tp+';charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;a.click();URL.revokeObjectURL(a.href)}
function exJSON(){dlF(JSON.stringify(data,null,2),'budget_backup.json','application/json');showToast(TT().msg.exported)}
function impJSON(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){try{let p=JSON.parse(e.target.result);if(p?.months){data=p;if(data.lang)lang=data.lang;saveNow();initMonth(cM);setLang(lang);renderActiveTab();pushToCloud();showToast(TT().msg.imported)}else showToast(TT().msg.invalidFile)}catch(err){showToast(TT().msg.invalidFile)}};r.readAsText(f);ev.target.value=''}
function resetAll(){let t=TT();if(!confirm(t.msg.confirmReset))return;if(!confirm(t.msg.confirmSure))return;localStorage.removeItem(DK_KEY);localStorage.removeItem(BK_KEY);data={categories:{komitmen:[...DKC],perbelanjaan:[...DEC]},months:{},lang};initMonth(cM);saveNow();renderActiveTab();showToast(t.msg.reset)}
function showToast(msg){let x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}

// ========== INIT ==========
function initApp(){loadData();if(!data.categories)data.categories={komitmen:[...DKC],perbelanjaan:[...DEC]};cM=MO[new Date().getMonth()];initMonth(cM);document.getElementById('monthSelect').innerHTML=MO.map(m=>'<option value="'+m+'"'+(m===cM?' selected':'')+'>'+m+'</option>').join('');document.getElementById('mainContent').innerHTML=TI.map(id=>'<div class="tab-content" id="tab-'+id+'"></div>').join('');document.getElementById('langBM').classList.toggle('active',lang==='bm');document.getElementById('langEN').classList.toggle('active',lang==='en');uHdr();bNav();sTab('dashboard');document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){safeSave();pushToCloud()}});window.addEventListener('beforeunload',()=>safeSave());initFirebase()}
window.addEventListener('DOMContentLoaded',()=>{let s=gSess(),a=gAuth();if(a&&s?.active)enterApp();else showLogin()});
</script>
</body>
