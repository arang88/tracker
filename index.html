<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Budget & Commitment Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g1:#1b5e20;--g2:#2e7d32;--g3:#4caf50;--g4:#81c784;--g5:#c8e6c9;--g6:#e8f5e9;--w:#fff;--gr1:#333;--gr2:#555;--gr3:#888;--gr5:#e0e0e0;--gr6:#f5f5f5;--red:#e53935;--ora:#ff9800;--blu:#1976d2;--sidebar-w:260px}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--gr6);color:var(--gr1);line-height:1.5;min-height:100vh}

/* ===== LOGIN PAGE ===== */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1b5e20 0%,#2e7d32 30%,#4caf50 60%,#81c784 100%);padding:20px}
.login-card{background:var(--w);border-radius:20px;padding:40px 32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-card .lc-icon{font-size:3.5rem;margin-bottom:12px}
.login-card h1{font-size:1.3rem;color:var(--g1);margin-bottom:4px;font-weight:800}
.login-card .lc-sub{font-size:.82rem;color:var(--gr3);margin-bottom:28px}
.login-card .lc-error{background:#ffebee;color:#c62828;padding:10px 14px;border-radius:8px;font-size:.82rem;font-weight:600;margin-bottom:14px;display:none}
.login-card .lc-error.show{display:block}
.login-card .lc-success{background:#e8f5e9;color:#1b5e20;padding:10px 14px;border-radius:8px;font-size:.82rem;font-weight:600;margin-bottom:14px;display:none}
.login-card .lc-success.show{display:block}
.login-input-group{position:relative;margin-bottom:16px;text-align:left}
.login-input-group label{display:block;font-size:.78rem;color:var(--gr2);font-weight:600;margin-bottom:6px}
.login-input-group input{width:100%;padding:12px 44px 12px 14px;border:2px solid var(--gr5);border-radius:10px;font-size:.95rem;transition:.2s;background:var(--gr6)}
.login-input-group input:focus{outline:none;border-color:var(--g3);background:var(--w);box-shadow:0 0 0 4px rgba(76,175,80,.15)}
.login-input-group .toggle-pw{position:absolute;right:12px;top:32px;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--gr3);padding:4px}
.login-input-group .toggle-pw:hover{color:var(--g2)}
.login-input-group .pw-strength{height:4px;border-radius:2px;margin-top:6px;transition:all .3s}
.login-remember{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:.82rem;color:var(--gr2)}
.login-remember input{width:16px;height:16px;accent-color:var(--g3)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--g1),var(--g3));color:var(--w);border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.3px}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(27,94,32,.35)}
.login-btn:active{transform:translateY(0)}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.login-footer{margin-top:24px;font-size:.72rem;color:var(--gr3);line-height:1.6}
.login-footer a{color:var(--g2);text-decoration:none;font-weight:600}
.login-divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:.75rem;color:var(--gr3)}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--gr5)}
.app-container{display:none}
.app-container.show{display:block}

/* ===== LOCK BUTTON ===== */
.btn-lock{background:none;border:2px solid rgba(255,255,255,.4);color:var(--w);font-size:.9rem;width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.btn-lock:hover{background:rgba(255,255,255,.15);border-color:var(--w)}

/* ===== HEADER ===== */
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--w);padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header-left{display:flex;align-items:center;gap:10px}
header h1{font-size:1rem;font-weight:700}
.hamburger{background:none;border:2px solid rgba(255,255,255,.5);color:var(--w);font-size:1.3rem;width:38px;height:38px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.hamburger:hover{background:rgba(255,255,255,.15);border-color:var(--w)}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.month-sel select{padding:5px 10px;border:none;border-radius:6px;font-size:.84rem;background:var(--w);color:var(--g2);font-weight:600;cursor:pointer}
.lang-toggle{display:flex;border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,.4);flex-shrink:0}
.lang-toggle button{padding:4px 10px;border:none;background:transparent;color:rgba(255,255,255,.7);font-size:.72rem;font-weight:700;cursor:pointer;transition:.2s}
.lang-toggle button.active{background:rgba(255,255,255,.25);color:var(--w)}
.active-tab-indicator{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.active-tab-indicator:hover{background:rgba(255,255,255,.25)}
.save-indicator{font-size:.7rem;padding:3px 8px;border-radius:4px;font-weight:600;transition:opacity .3s}
.save-indicator.saving{background:var(--ora);color:var(--w);opacity:1}
.save-indicator.saved{background:rgba(255,255,255,.2);color:var(--w);opacity:1}
.save-indicator.hidden{opacity:0}

/* ===== DRAWER ===== */
.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;visibility:hidden;transition:opacity .3s;backdrop-filter:blur(2px)}
.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--w);z-index:201;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.15)}
.drawer.open{transform:translateX(0)}
.drawer-header{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--w);padding:20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.drawer-header h2{font-size:1rem;font-weight:700}
.drawer-close{background:none;border:none;color:var(--w);font-size:1.5rem;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.drawer-close:hover{background:rgba(255,255,255,.2)}
.drawer-nav{flex:1;overflow-y:auto;padding:8px 0}
.drawer-nav button{width:100%;display:flex;align-items:center;gap:14px;padding:14px 20px;border:none;background:none;text-align:left;font-size:.88rem;color:var(--gr2);cursor:pointer;transition:.15s;font-weight:500;border-left:4px solid transparent}
.drawer-nav button:hover{background:var(--g6);color:var(--g2)}
.drawer-nav button.active{background:var(--g6);color:var(--g1);font-weight:700;border-left-color:var(--g3)}
.drawer-nav button .nav-icon{font-size:1.2rem;width:28px;text-align:center;flex-shrink:0}
.drawer-footer{padding:14px 20px;border-top:1px solid var(--gr5);font-size:.72rem;color:var(--gr3);text-align:center;flex-shrink:0}

/* ===== CONTENT ===== */
main{max-width:1000px;margin:0 auto;padding:16px}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:var(--w);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid var(--gr5)}
.card h2{font-size:1.02rem;color:var(--g2);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--g5);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:.92rem;color:var(--g1);margin:14px 0 10px}
.person-toggle{display:flex;gap:0;margin-bottom:16px;border-radius:8px;overflow:hidden;border:2px solid var(--g3)}
.person-toggle button{flex:1;padding:10px 14px;border:none;background:var(--w);color:var(--g2);font-weight:600;cursor:pointer;font-size:.86rem;transition:.2s}
.person-toggle button.active{background:var(--g3);color:var(--w)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.76rem;color:var(--gr2);font-weight:600;word-break:break-word}
.form-group input,.form-group select{padding:9px 11px;border:1.5px solid var(--gr5);border-radius:8px;font-size:.86rem;transition:.2s;width:100%;min-width:0}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--g3);box-shadow:0 0 0 3px rgba(76,175,80,.15)}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.84rem;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--g3);color:var(--w)}.btn-primary:hover{background:var(--g2)}
.btn-danger{background:var(--red);color:var(--w)}.btn-danger:hover{background:#c62828}
.btn-warning{background:var(--ora);color:var(--w)}.btn-warning:hover{background:#f57c00}
.btn-outline{background:var(--w);color:var(--g2);border:1.5px solid var(--g3)}.btn-outline:hover{background:var(--g6)}
.btn-sm{padding:5px 10px;font-size:.76rem;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:.72rem;border-radius:4px}
.btn-add-circle{width:30px;height:30px;border-radius:50%;background:var(--g3);color:var(--w);border:none;font-size:1rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.btn-add-circle:hover{background:var(--g2);transform:scale(1.1)}
.btn-add-circle.gold{background:var(--ora)}.btn-add-circle.gold:hover{background:#f57c00}
.btn-edit{width:26px;height:26px;border-radius:50%;background:var(--blu);color:var(--w);border:none;font-size:.7rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.btn-edit:hover{background:#1565c0;transform:scale(1.1)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric-card{background:var(--w);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--gr5);box-shadow:0 1px 3px rgba(0,0,0,.06);transition:.2s}
.metric-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.1);transform:translateY(-1px)}
.metric-card .mc-icon{font-size:1.4rem;margin-bottom:5px}
.metric-card .mc-label{font-size:.7rem;color:var(--gr3);font-weight:600;text-transform:uppercase;margin-bottom:4px;word-break:break-word}
.metric-card .mc-value{font-size:1.1rem;font-weight:700;color:var(--g1)}
.metric-card.green{border-left:4px solid var(--g3)}.metric-card.red{border-left:4px solid var(--red)}.metric-card.orange{border-left:4px solid var(--ora)}.metric-card.blue{border-left:4px solid var(--blu)}
.health-bar{height:22px;background:var(--gr5);border-radius:11px;overflow:hidden;margin:8px 0}
.health-bar-fill{height:100%;border-radius:11px;transition:width .5s;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--w);min-width:30px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gr5);font-size:.88rem}
.summary-row:last-child{border:none;font-weight:700;font-size:1rem;color:var(--g1);padding-top:12px;border-top:2px solid var(--g3)}
.collapse-section{margin-bottom:8px;border:1px solid var(--gr5);border-radius:10px;overflow:hidden;background:var(--w)}
.collapse-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gr6);cursor:pointer;gap:8px;transition:background .15s;user-select:none}
.collapse-header:hover{background:var(--g6)}
.collapse-header.income-header{background:linear-gradient(135deg,#fff8e1,#fff3e0)}
.collapse-header.income-header:hover{background:#fff3e0}
.collapse-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.collapse-arrow{font-size:.8rem;transition:transform .25s;flex-shrink:0;width:20px;text-align:center;color:var(--gr3)}
.collapse-arrow.open{transform:rotate(90deg)}
.collapse-name{font-weight:600;font-size:.86rem;color:var(--gr1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collapse-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.collapse-total{font-weight:700;font-size:.92rem;color:var(--g2);white-space:nowrap}
.collapse-total.gold{color:#e65100}
.collapse-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:12px;background:var(--g3);color:var(--w);font-size:.68rem;font-weight:700}
.collapse-count.zero{background:var(--gr5);color:var(--gr3)}
.collapse-count.gold{background:var(--ora)}
.collapse-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1),padding .25s}
.collapse-body.open{max-height:3000px;padding:8px 12px 12px}
.entry-item{display:flex;align-items:center;padding:8px 10px;font-size:.8rem;border-bottom:1px solid var(--gr5);gap:6px;flex-wrap:wrap;transition:background .15s}
.entry-item:last-child{border-bottom:none}
.entry-item:hover{background:var(--g6)}
.entry-item .ei-amount{font-weight:600;color:var(--g2);white-space:nowrap;min-width:75px}
.entry-item .ei-nota{color:var(--gr2);font-style:italic;flex:1;min-width:50px;word-break:break-word}
.entry-item .ei-date{color:var(--gr3);font-size:.72rem;white-space:nowrap}
.entry-item .ei-actions{display:flex;gap:4px;flex-shrink:0}
.add-form{background:var(--g6);border-radius:8px;padding:12px;margin:8px 0 4px;display:none;border:1.5px dashed var(--g4)}
.add-form.show{display:block}
.add-form .af-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.add-form .af-row .form-group{flex:1;min-width:100px}
.kom-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kom-date-badge{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:4px 10px;background:var(--g5);border-radius:6px;font-size:.7rem;color:var(--g1);font-weight:600}
.kom-nota-display{font-size:.74rem;color:var(--gr2);font-style:italic;margin-top:4px}
.log-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.log-table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:580px}
table.log-table th{background:var(--g2);color:var(--w);padding:9px 10px;text-align:left;font-size:.76rem;white-space:nowrap}
table.log-table td{padding:7px 10px;border-bottom:1px solid var(--gr5);word-break:break-word}
table.log-table tr:nth-child(even){background:var(--g6)}
table.log-table tr:hover{background:var(--g5)}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:.68rem;font-weight:700}
.badge-s{background:#bbdefb;color:#1565c0}.badge-i{background:#f8bbd0;color:#c62828}.badge-kom{background:#fff3e0;color:#e65100}.badge-exp{background:#e8f5e9;color:#1b5e20}.badge-inc{background:#fff9c4;color:#f57f17}
.log-filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.log-filters button{padding:5px 12px;border-radius:20px;border:1.5px solid var(--gr5);background:var(--w);font-size:.76rem;font-weight:600;cursor:pointer;transition:.2s;color:var(--gr2)}
.log-filters button.active{background:var(--g3);color:var(--w);border-color:var(--g3)}
.show-more-bar{text-align:center;padding:12px;border-top:1px solid var(--gr5)}
.sim-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gr6);border-radius:8px;margin-bottom:6px}
.sim-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--g3);flex-shrink:0}
.sim-item .si-name{flex:1;font-size:.86rem;font-weight:500;word-break:break-word}
.sim-item .si-amt{font-weight:700;color:var(--g2);white-space:nowrap}
.sim-result{background:var(--g6);border:2px solid var(--g3);border-radius:10px;padding:20px;text-align:center;margin-top:16px}
.sim-result .sr-label{font-size:.88rem;color:var(--gr2)}.sim-result .sr-value{font-size:1.8rem;font-weight:800;color:var(--g1)}
.chart-container{position:relative;width:100%;max-width:100%}
.chart-container canvas{max-width:100%;height:auto!important}
.cat-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gr6);border-radius:8px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.cat-list-item .cli-name{font-weight:600;font-size:.86rem;flex:1;min-width:100px;word-break:break-word}
.export-btn-group{display:flex;gap:12px;flex-wrap:wrap}
.expand-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.expand-controls button{padding:6px 14px;border-radius:20px;border:1.5px solid var(--g4);background:var(--w);font-size:.74rem;font-weight:600;cursor:pointer;color:var(--g2);transition:.15s}
.expand-controls button:hover{background:var(--g6);border-color:var(--g3)}
.total-bar{margin-top:16px;padding:14px;background:var(--g5);border-radius:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.total-bar .tb-label{font-weight:700;font-size:1.02rem}.total-bar .tb-value{font-weight:800;font-size:1.05rem}
.no-entries{text-align:center;padding:16px;color:var(--gr3);font-size:.82rem}
.toast{position:fixed;bottom:20px;right:20px;background:var(--g2);color:var(--w);padding:12px 20px;border-radius:8px;font-size:.84rem;font-weight:600;z-index:999;transform:translateY(100px);opacity:0;transition:.3s;max-width:90vw}
.toast.show{transform:translateY(0);opacity:1}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-overlay.show{display:flex}
.modal{background:var(--w);border-radius:14px;padding:24px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.modal h3{color:var(--g2);margin-bottom:16px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.modal .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}

/* ===== SECURITY SETTINGS ===== */
.security-card{background:linear-gradient(135deg,#e3f2fd,#bbdefb);border:1px solid #90caf9;border-radius:12px;padding:20px;margin-bottom:16px}
.security-card h3{color:#1565c0;margin-bottom:12px}
.lock-info{display:flex;align-items:center;gap:10px;padding:12px;background:var(--w);border-radius:8px;margin-bottom:10px;font-size:.84rem}
.lock-info .li-icon{font-size:1.5rem}

@media(max-width:600px){
header h1{font-size:.85rem}.header-right{gap:4px}
.metric-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.metric-card{padding:10px}.metric-card .mc-value{font-size:.92rem}.metric-card .mc-label{font-size:.66rem}
main{padding:10px}.card{padding:14px;border-radius:10px}
.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr 1fr}
.kom-fields{grid-template-columns:1fr}
.add-form .af-row{flex-direction:column}.add-form .af-row .form-group{min-width:100%}
.person-toggle button{font-size:.8rem;padding:8px 10px}
.drawer{width:78vw;max-width:280px}
.active-tab-indicator{font-size:.72rem;padding:4px 8px}
.lang-toggle button{padding:3px 7px;font-size:.68rem}
.collapse-name{font-size:.8rem}.collapse-total{font-size:.84rem}.modal{padding:18px}
.login-card{padding:28px 22px}
.login-card h1{font-size:1.1rem}
}
@media print{
header,.hamburger,.drawer,.drawer-overlay,.btn,.btn-add-circle,.btn-edit,.add-form,.person-toggle,.toast,.active-tab-indicator,.lang-toggle,.expand-controls,.modal-overlay,.save-indicator,.btn-lock,.login-page{display:none!important}
.tab-content{display:block!important}.app-container{display:block!important}body{background:#fff}
.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
.collapse-body{max-height:none!important;padding:8px 12px!important}
}
</style>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div class="login-page" id="loginPage">
<div class="login-card">
<div class="lc-icon">🔐</div>
<h1 id="loginTitle">Budget Tracker</h1>
<p class="lc-sub" id="loginSub">Masukkan kata laluan untuk akses</p>

<script>
// ==================== AUTH SYSTEM ====================
const AUTH_KEY='hbudget_auth';
const SESSION_KEY='hbudget_session';
let inactivityTimer=null;
const AUTO_LOCK_MIN=15;

async function hashPassword(pw){
const encoder=new TextEncoder();
const data=encoder.encode(pw+'_hbudget_salt_2024');
const hash=await crypto.subtle.digest('SHA-256',data);
return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function getAuth(){
try{let a=localStorage.getItem(AUTH_KEY);return a?JSON.parse(a):null}catch(e){return null}
}
function setAuth(obj){localStorage.setItem(AUTH_KEY,JSON.stringify(obj))}

function getSession(){
try{let s=localStorage.getItem(SESSION_KEY);if(!s)return null;let parsed=JSON.parse(s);
if(parsed.expires&&Date.now()>parsed.expires)return null;
return parsed}catch(e){return null}
}
function setSession(remember){
let expires=remember?Date.now()+(7*24*60*60*1000):Date.now()+(2*60*60*1000);
localStorage.setItem(SESSION_KEY,JSON.stringify({active:true,expires,ts:Date.now()}))
}
function clearSession(){localStorage.removeItem(SESSION_KEY)}

function showLoginPage(){
document.getElementById('loginPage').style.display='flex';
document.getElementById('appContainer').classList.remove('show');
let auth=getAuth();
if(!auth){renderSetupForm()}else{renderLoginForm()}
}

function renderSetupForm(){
document.getElementById('loginTitle').textContent='🔐 Buat Kata Laluan';
document.getElementById('loginSub').textContent='Tetapkan kata laluan untuk melindungi data anda';
document.getElementById('loginForm').innerHTML=`
<div class="login-input-group">
<label>Kata Laluan Baru</label>
<input type="password" id="setupPw1" placeholder="Minimum 4 aksara" onkeyup="checkPwStrength(this.value)" onkeydown="if(event.key==='Enter')document.getElementById('setupPw2').focus()">
<button class="toggle-pw" onclick="togglePwVis('setupPw1',this)">👁️</button>
<div class="pw-strength" id="pwStrength" style="background:var(--gr5)"></div>
</div>
<div class="login-input-group">
<label>Sahkan Kata Laluan</label>
<input type="password" id="setupPw2" placeholder="Masukkan semula" onkeydown="if(event.key==='Enter')doSetup()">
<button class="toggle-pw" onclick="togglePwVis('setupPw2',this)">👁️</button>
</div>
<div class="login-remember">
<input type="checkbox" id="setupRemember" checked>
<label for="setupRemember">Ingat saya selama 7 hari</label>
</div>
<button class="login-btn" onclick="doSetup()">🔐 Tetapkan & Masuk</button>`;
document.getElementById('loginFooter').textContent='🔒 Kata laluan di-hash (SHA-256) — tiada siapa boleh lihat';
setTimeout(()=>document.getElementById('setupPw1').focus(),300);
}

function renderLoginForm(){
document.getElementById('loginTitle').textContent='🔐 Budget Tracker';
document.getElementById('loginSub').textContent='Masukkan kata laluan untuk akses';
document.getElementById('loginError').classList.remove('show');
document.getElementById('loginSuccess').classList.remove('show');
document.getElementById('loginForm').innerHTML=`
<div class="login-input-group">
<label>Kata Laluan</label>
<input type="password" id="loginPw" placeholder="Masukkan kata laluan" onkeydown="if(event.key==='Enter')doLogin()">
<button class="toggle-pw" onclick="togglePwVis('loginPw',this)">👁️</button>
</div>
<div class="login-remember">
<input type="checkbox" id="loginRemember" checked>
<label for="loginRemember">Ingat saya selama 7 hari</label>
</div>
<button class="login-btn" onclick="doLogin()">🔓 Masuk</button>
<div class="login-divider">atau</div>
<button class="btn btn-outline btn-sm" onclick="showResetConfirm()" style="width:100%;justify-content:center;color:var(--red);border-color:var(--red)">🗑️ Lupa? Reset Kata Laluan & Data</button>`;
document.getElementById('loginFooter').textContent='🔒 Data dilindungi dan disimpan secara tempatan';
setTimeout(()=>document.getElementById('loginPw').focus(),300);
}

async function doSetup(){
let pw1=document.getElementById('setupPw1').value;
let pw2=document.getElementById('setupPw2').value;
let errEl=document.getElementById('loginError');
let sucEl=document.getElementById('loginSuccess');
errEl.classList.remove('show');sucEl.classList.remove('show');
if(pw1.length<4){errEl.textContent='⚠️ Minimum 4 aksara';errEl.classList.add('show');return}
if(pw1!==pw2){errEl.textContent='⚠️ Kata laluan tidak sepadan';errEl.classList.add('show');return}
let hash=await hashPassword(pw1);
setAuth({hash,created:Date.now()});
let remember=document.getElementById('setupRemember').checked;
setSession(remember);
sucEl.textContent='✅ Kata laluan ditetapkan!';sucEl.classList.add('show');
setTimeout(()=>enterApp(),500);
}

async function doLogin(){
let pw=document.getElementById('loginPw').value;
let errEl=document.getElementById('loginError');
errEl.classList.remove('show');
if(!pw){errEl.textContent='⚠️ Masukkan kata laluan';errEl.classList.add('show');return}
let hash=await hashPassword(pw);
let auth=getAuth();
if(!auth||hash!==auth.hash){
errEl.textContent='❌ Kata laluan salah';errEl.classList.add('show');
document.getElementById('loginPw').value='';
document.getElementById('loginPw').focus();
return}
let remember=document.getElementById('loginRemember').checked;
setSession(remember);
enterApp();
}

function showResetConfirm(){
let errEl=document.getElementById('loginError');
if(!confirm('⚠️ Ini akan PADAM kata laluan DAN semua data budget. Teruskan?'))return;
if(!confirm('PASTI? Semua data akan hilang selamanya.'))return;
localStorage.removeItem(AUTH_KEY);
localStorage.removeItem(SESSION_KEY);
localStorage.removeItem(STORE_KEY);
localStorage.removeItem(BACKUP_KEY);
errEl.classList.remove('show');
renderSetupForm();
document.getElementById('loginSuccess').textContent='🔄 Reset selesai. Sila buat kata laluan baru.';
document.getElementById('loginSuccess').classList.add('show');
}

function enterApp(){
document.getElementById('loginPage').style.display='none';
document.getElementById('appContainer').classList.add('show');
startInactivityTimer();
initApp();
}

function lockApp(){
safeSave();
clearSession();
stopInactivityTimer();
document.getElementById('appContainer').classList.remove('show');
document.getElementById('loginPage').style.display='flex';
renderLoginForm();
}

function togglePwVis(inputId,btn){
let inp=document.getElementById(inputId);
if(inp.type==='password'){inp.type='text';btn.textContent='🙈'}
else{inp.type='password';btn.textContent='👁️'}
}

function checkPwStrength(pw){
let bar=document.getElementById('pwStrength');
if(!bar)return;
let score=0;
if(pw.length>=4)score++;if(pw.length>=8)score++;
if(/[A-Z]/.test(pw))score++;if(/[0-9]/.test(pw))score++;
if(/[^a-zA-Z0-9]/.test(pw))score++;
let colors=['#e53935','#ff9800','#ff9800','#4caf50','#1b5e20'];
let widths=['20%','40%','60%','80%','100%'];
let i=Math.min(score,4);
bar.style.width=widths[i];bar.style.background=colors[i];
}

// ===== INACTIVITY AUTO-LOCK =====
function startInactivityTimer(){
stopInactivityTimer();
const events=['mousedown','mousemove','keydown','touchstart','scroll','click'];
events.forEach(e=>document.addEventListener(e,resetInactivity,{passive:true}));
resetInactivity();
}
function stopInactivityTimer(){
clearTimeout(inactivityTimer);
const events=['mousedown','mousemove','keydown','touchstart','scroll','click'];
events.forEach(e=>document.removeEventListener(e,resetInactivity));
}
function resetInactivity(){
clearTimeout(inactivityTimer);
inactivityTimer=setTimeout(()=>{
showToast('🔒 Auto-lock: Tiada aktiviti '+AUTO_LOCK_MIN+' minit');
setTimeout(()=>lockApp(),1500);
},AUTO_LOCK_MIN*60*1000);
}

async function showChangePw(){
let E=lang==='bm';
openModal(`<h3>🔑 ${E?'Tukar Kata Laluan':'Change Password'}</h3>
<div class="form-group" style="margin-bottom:10px"><label>${E?'Kata Laluan Semasa':'Current Password'}</label><input type="password" id="cpw_old"></div>
<div class="form-group" style="margin-bottom:10px"><label>${E?'Kata Laluan Baru':'New Password'}</label><input type="password" id="cpw_new"></div>
<div class="form-group" style="margin-bottom:10px"><label>${E?'Sahkan Baru':'Confirm New'}</label><input type="password" id="cpw_confirm"></div>
<div class="modal-actions">
<button class="btn btn-outline" onclick="closeModal()">${E?'Batal':'Cancel'}</button>
<button class="btn btn-primary" onclick="doChangePw()">💾 ${E?'Simpan':'Save'}</button></div>`);
}
async function doChangePw(){
let old=document.getElementById('cpw_old').value;
let nw=document.getElementById('cpw_new').value;
let confirm=document.getElementById('cpw_confirm').value;
let auth=getAuth();if(!auth)return;
let oldHash=await hashPassword(old);
if(oldHash!==auth.hash){showToast('❌ Kata laluan semasa salah');return}
if(nw.length<4){showToast('⚠️ Minimum 4 aksara');return}
if(nw!==confirm){showToast('⚠️ Tidak sepadan');return}
let newHash=await hashPassword(nw);
setAuth({hash:newHash,created:Date.now()});
closeModal();showToast('✅ Kata laluan ditukar');
}

const STORE_KEY='hbudget_v8';

let saveTimr=null,isSaving=false,renderTimr=null;

function safeSave(){
if(isSaving)return;isSaving=true;showSaveInd('saving');
try{let json=JSON.stringify(data);if(!json||json.length<10){isSaving=false;return}
let existing=localStorage.getItem(STORE_KEY);if(existing&&existing.length>50)localStorage.setItem(BACKUP_KEY,existing);
localStorage.setItem(STORE_KEY,json);showSaveInd('saved')}catch(e){console.error('Save error:',e);showToast('⚠️ Storage error')}
isSaving=false}
function debouncedSave(){clearTimeout(saveTimr);saveTimr=setTimeout(safeSave,300)}
function saveData(){data.lang=lang;data._lastSaved=Date.now();debouncedSave()}
function saveDataNow(){data.lang=lang;data._lastSaved=Date.now();safeSave()}
function showSaveInd(s){let el=document.getElementById('saveIndicator');if(!el)return;el.className='save-indicator';if(s==='saving'){el.textContent='💾 ...';el.classList.add('saving')}else{el.textContent='✅';el.classList.add('saved');setTimeout(()=>{el.classList.add('hidden');el.classList.remove('saved')},1500)}}

function isoToDisplay(iso){if(!iso||iso==='-')return'-';let p=iso.split('-');if(p.length===3)return p[2]+'/'+p[1]+'/'+p[0];return iso}
function displayToISO(dd){if(!dd||dd==='-')return'';let p=dd.split('/');if(p.length===3)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');return''}
function makeStamp(iso){return{date:isoToDisplay(iso||todayISO()),time:nowTime(),ts:Date.now()}}
function migrateKom(o){if(typeof o==='number')return{amount:o,nota:'',date:'',time:'',ts:0};if(typeof o==='object'&&o!==null){o.amount=o.amount||0;o.nota=o.nota||'';o.date=o.date||'';o.time=o.time||'';o.ts=o.ts||0;return o}return{amount:0,nota:'',date:'',time:'',ts:0}}
function migrateWT(o){if(typeof o==='number')return o>0?[{id:gid(),amount:o,nota:'Migrated',date:'',time:'',ts:0}]:[];if(Array.isArray(o))return o;return[]}
function initMonth(m){if(!data.months)data.months={};let isNew=!data.months[m];if(isNew)data.months[m]={suami:newPerson(),isteri:newPerson()};let md=data.months[m];['suami','isteri'].forEach(p=>{if(!md[p])md[p]=newPerson();if(!md[p].wangTambahan)md[p].wangTambahan={};WT_KEYS.forEach(w=>{md[p].wangTambahan[w]=migrateWT(md[p].wangTambahan[w])});if(!md[p].komitmen)md[p].komitmen={};data.categories.komitmen.forEach(k=>{if(md[p].komitmen[k]===undefined)md[p].komitmen[k]={amount:0,nota:'',date:'',time:'',ts:0};else md[p].komitmen[k]=migrateKom(md[p].komitmen[k])});if(!md[p].perbelanjaan)md[p].perbelanjaan={};data.categories.perbelanjaan.forEach(c=>{if(!md[p].perbelanjaan[c])md[p].perbelanjaan[c]=[]})});if(isNew)saveData()}
function newPerson(){let p={gaji:0,wangTambahan:{},komitmen:{},perbelanjaan:{}};WT_KEYS.forEach(w=>p.wangTambahan[w]=[]);data.categories.komitmen.forEach(k=>p.komitmen[k]={amount:0,nota:'',date:'',time:'',ts:0});data.categories.perbelanjaan.forEach(c=>p.perbelanjaan[c]=[]);return p}
function gd(p){return data.months[currentMonth]?data.months[currentMonth][p||currentPerson]:null}
function komAmt(o){return typeof o==='object'?(parseFloat(o.amount)||0):(parseFloat(o)||0)}
function wtCatTotal(p,k){let d=gd(p);if(!d||!Array.isArray(d.wangTambahan[k]))return 0;return d.wangTambahan[k].reduce((a,e)=>a+(parseFloat(e.amount)||0),0)}
function totalWT(p){let x=0;WT_KEYS.forEach(w=>x+=wtCatTotal(p,w));return x}
function totalPendapatan(p){let d=gd(p);if(!d)return 0;return(parseFloat(d.gaji)||0)+totalWT(p)}
function totalKomitmen(p){let d=gd(p);if(!d)return 0;return Object.values(d.komitmen).reduce((a,b)=>a+komAmt(b),0)}
function totalPerbelanjaan(p){let d=gd(p);if(!d)return 0;let x=0;Object.values(d.perbelanjaan).forEach(arr=>{if(Array.isArray(arr))arr.forEach(e=>x+=(parseFloat(e.amount)||0))});return x}
function totalExpCat(p,cat){let d=gd(p);if(!d||!d.perbelanjaan[cat])return 0;return d.perbelanjaan[cat].reduce((a,e)=>a+(parseFloat(e.amount)||0),0)}
function baki(p){return totalPendapatan(p)-totalKomitmen(p)-totalPerbelanjaan(p)}
function rm(v){return'RM '+(parseFloat(v)||0).toFixed(2)}
function pct(v,x){return x?((v/x)*100):0}
function wtLabel(i){return T().income.cats[i]||WT_KEYS[i]}
function ci(s){return s.replace(/[^a-zA-Z0-9]/g,'_')}
function esc(s){return s.replace(/'/g,"\\'")}
function tog(id){expanded[id]=!expanded[id];let a=document.getElementById('arrow_'+id),b=document.getElementById('body_'+id);if(a)a.classList.toggle('open',expanded[id]);if(b)b.classList.toggle('open',expanded[id])}
function expandGroup(pf,keys){keys.forEach(k=>{expanded[pf+ci(k)]=true});renderActiveTab()}
function collapseGroup(pf,keys){keys.forEach(k=>{expanded[pf+ci(k)]=false});renderActiveTab()}
function setLang(l){lang=l;document.getElementById('langBM').classList.toggle('active',l==='bm');document.getElementById('langEN').classList.toggle('active',l==='en');saveData();buildDrawerNav();updateActiveLabel();updateHeader();renderActiveTab()}
function updateHeader(){document.getElementById('headerTitle').textContent=T().appTitle;document.getElementById('drawerTitle').textContent=T().menuTitle;document.getElementById('drawerFooter').textContent=T().footerText}
function toggleDrawer(){document.getElementById('drawer').classList.toggle('open');document.getElementById('drawerOverlay').classList.toggle('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('open')}
function buildDrawerNav(){let tt=T().tabs;document.getElementById('drawerNav').innerHTML=TAB_IDS.map((id,i)=>`<button onclick="switchTab('${id}')" class="${id===activeTab?'active':''}"><span class="nav-icon">${TAB_ICONS[i]}</span><span>${tt[id]}</span></button>`).join('')}
function updateActiveLabel(){let i=TAB_IDS.indexOf(activeTab);document.getElementById('activeTabLabel').innerHTML=TAB_ICONS[i]+' '+T().tabs[TAB_IDS[i]]}
function switchTab(id){activeTab=id;logLimit=20;document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));let tc=document.getElementById('tab-'+id);if(tc)tc.classList.add('active');buildDrawerNav();updateActiveLabel();closeDrawer();renderActiveTab()}
function renderActiveTab(){clearTimeout(renderTimr);renderTimr=setTimeout(()=>{let fn={dashboard:renderDashboard,pendapatan:renderPendapatan,komitmen:renderKomitmen,perbelanjaan:renderPerbelanjaan,quickadd:renderQuickAdd,log:renderLog,simulasi:renderSimulasi,carta:renderCarta,kategori:renderKategori,eksport:renderEksport};if(fn[activeTab])fn[activeTab]()},50)}
function personToggle(cb){let p=T().person;return`<div class="person-toggle"><button class="${currentPerson==='suami'?'active':''}" onclick="currentPerson='suami';${cb||'renderActiveTab()'}">${p.husband}</button><button class="${currentPerson==='isteri'?'active':''}" onclick="currentPerson='isteri';${cb||'renderActiveTab()'}">${p.wife}</button></div>`}
function changeMonth(m){currentMonth=m;initMonth(m);expanded={};renderActiveTab()}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalOverlay').classList.add('show')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

function editEntry(type,person,cat,id){let d=data.months[currentMonth][person];if(!d)return;let entry;if(type==='wt')entry=(d.wangTambahan[cat]||[]).find(e=>e.id===id);else entry=(d.perbelanjaan[cat]||[]).find(e=>e.id===id);if(!entry)return;let E=T().edit,iso=displayToISO(entry.date)||todayISO();openModal(`<h3>${E.title}</h3><div class="form-group" style="margin-bottom:10px"><label>${E.amtLabel}</label><input type="number" id="edit_amt" value="${entry.amount}" step="0.01"></div><div class="form-group" style="margin-bottom:10px"><label>${E.notaLabel}</label><input type="text" id="edit_nota" value="${entry.nota||''}"></div><div class="form-group" style="margin-bottom:10px"><label>${E.dateLabel}</label><input type="date" id="edit_date" value="${iso}"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">${E.cancel}</button><button class="btn btn-primary" onclick="saveEdit('${type}','${person}','${esc(cat)}','${id}')">${E.save}</button></div>`)}
function saveEdit(type,person,cat,id){let amt=parseFloat(document.getElementById('edit_amt').value),nota=document.getElementById('edit_nota').value.trim(),dateISO=document.getElementById('edit_date').value;if(!amt||amt<=0){showToast(T().msg.enterAmount);return}if(!nota){showToast(T().msg.notaRequired);return}let d=data.months[currentMonth][person];if(!d)return;let arr=type==='wt'?d.wangTambahan[cat]:d.perbelanjaan[cat];let entry=(arr||[]).find(e=>e.id===id);if(entry){entry.amount=amt;entry.nota=nota;entry.date=isoToDisplay(dateISO);entry.time=nowTime();entry.ts=Date.now()}saveDataNow();closeModal();showToast(T().msg.edited);renderActiveTab()}

function collapseHTML(secId,name,total,count,isIncome,bodyHTML,addBtn){let isOpen=expanded[secId]||false;let hdr=isIncome?'collapse-header income-header':'collapse-header';let tc=isIncome?'collapse-total gold':'collapse-total';let cc=count===0?'collapse-count zero':(isIncome?'collapse-count gold':'collapse-count');return`<div class="collapse-section"><div class="${hdr}" onclick="tog('${secId}')"><div class="collapse-left"><span class="collapse-arrow${isOpen?' open':''}" id="arrow_${secId}">▶</span><span class="collapse-name">${name}</span><span class="${cc}">${count}</span></div><div class="collapse-right"><span class="${tc}">${rm(total)}</span>${addBtn||''}</div></div><div class="collapse-body${isOpen?' open':''}" id="body_${secId}">${bodyHTML}</div></div>`}
function entryListHTML(entries,type,person,cat){if(entries.length===0)return`<p class="no-entries">${T().exp.noEntries}</p>`;return entries.map(e=>`<div class="entry-item"><span class="ei-amount">${rm(e.amount)}</span><span class="ei-nota">📝 ${e.nota||'-'}</span><span class="ei-date">📅 ${e.date||'-'} ${e.time||''}</span><span class="ei-actions"><button class="btn-edit" onclick="editEntry('${type}','${person}','${esc(cat)}','${e.id}')">✏️</button><button class="btn btn-danger btn-xs" onclick="delEntry('${type}','${person}','${esc(cat)}','${e.id}')">✕</button></span></div>`).join('')}
function addFormHTML(fid,amtId,notaId,dateId,addFn,cancelFn,labels){return`<div class="add-form" id="${fid}"><div class="af-row"><div class="form-group"><label>${labels.amt}</label><input type="number" id="${amtId}" placeholder="0.00" step="0.01"></div><div class="form-group"><label>${labels.nota}</label><input type="text" id="${notaId}" placeholder="${labels.ph}"></div><div class="form-group"><label>${labels.date}</label><input type="date" id="${dateId}" value="${todayISO()}"></div><div style="display:flex;gap:6px;align-items:end;padding-bottom:2px"><button class="btn btn-primary btn-sm" onclick="${addFn}">${labels.add}</button><button class="btn btn-outline btn-sm" onclick="${cancelFn}">${labels.cancel}</button></div></div></div>`}
function delEntry(type,person,cat,id){if(!confirm(T().msg.confirmDel))return;let d=data.months[currentMonth][person];if(!d)return;if(type==='wt'&&Array.isArray(d.wangTambahan[cat]))d.wangTambahan[cat]=d.wangTambahan[cat].filter(e=>e.id!==id);if(type==='exp'&&Array.isArray(d.perbelanjaan[cat]))d.perbelanjaan[cat]=d.perbelanjaan[cat].filter(e=>e.id!==id);saveDataNow();showToast(T().msg.deleted);renderActiveTab()}
function openForm(secId,fid,focusId){if(!expanded[secId]){expanded[secId]=true;renderActiveTab()}setTimeout(()=>{let f=document.getElementById(fid);if(f){f.classList.add('show');let inp=document.getElementById(focusId);if(inp)inp.focus()}},80)}

function renderDashboard(){let el=document.getElementById('tab-dashboard');if(!el||!el.classList.contains('active'))return;let t=T(),D=t.dashboard,H=t.health;let ps=totalPendapatan('suami'),pi=totalPendapatan('isteri'),pt=ps+pi,ks=totalKomitmen('suami'),ki=totalKomitmen('isteri'),es=totalPerbelanjaan('suami'),ei=totalPerbelanjaan('isteri'),bs=baki('suami'),bi=baki('isteri'),bt=bs+bi;let u=pt>0?pct(ks+ki+es+ei,pt):0,hC=u>=70?'var(--red)':u>=60?'var(--ora)':'var(--g3)',hL=u>=70?H.danger:u>=60?H.warning:H.healthy;el.innerHTML=`<div class="card"><h2>${D.title} — ${currentMonth}</h2><div class="metric-grid"><div class="metric-card green"><div class="mc-icon">👨</div><div class="mc-label">${D.incS}</div><div class="mc-value">${rm(ps)}</div></div><div class="metric-card green"><div class="mc-icon">👩</div><div class="mc-label">${D.incW}</div><div class="mc-value">${rm(pi)}</div></div><div class="metric-card blue"><div class="mc-icon">${t.person.family}</div><div class="mc-label">${D.incF}</div><div class="mc-value">${rm(pt)}</div></div><div class="metric-card orange"><div class="mc-icon">📋</div><div class="mc-label">${D.komS}</div><div class="mc-value">${rm(ks)}</div></div><div class="metric-card orange"><div class="mc-icon">📋</div><div class="mc-label">${D.komW}</div><div class="mc-value">${rm(ki)}</div></div><div class="metric-card red"><div class="mc-icon">🛒</div><div class="mc-label">${D.expS}</div><div class="mc-value">${rm(es)}</div></div><div class="metric-card red"><div class="mc-icon">🛒</div><div class="mc-label">${D.expW}</div><div class="mc-value">${rm(ei)}</div></div><div class="metric-card green"><div class="mc-icon">💵</div><div class="mc-label">${D.balS}</div><div class="mc-value" style="color:${bs<0?'var(--red)':'var(--g1)'}">${rm(bs)}</div></div><div class="metric-card green"><div class="mc-icon">💵</div><div class="mc-label">${D.balW}</div><div class="mc-value" style="color:${bi<0?'var(--red)':'var(--g1)'}">${rm(bi)}</div></div><div class="metric-card ${u>=70?'red':u>=60?'orange':'green'}"><div class="mc-icon">${hL.split(' ')[0]}</div><div class="mc-label">${D.balF}</div><div class="mc-value" style="color:${bt<0?'var(--red)':'var(--g1)'}">${rm(bt)}</div></div></div></div><div class="card"><h2>${H.title}</h2><p style="font-size:.86rem;margin-bottom:8px">${H.usage}: <strong>${u.toFixed(1)}%</strong> | ${H.status}: <strong style="color:${hC}">${hL}</strong></p><div class="health-bar"><div class="health-bar-fill" style="width:${Math.min(u,100)}%;background:${hC}">${u.toFixed(0)}%</div></div><div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--gr3);margin-top:4px"><span>0%</span><span style="color:var(--ora)">60%</span><span style="color:var(--red)">70%</span><span>100%</span></div><div class="grid-2" style="margin-top:16px"><div><h3>${t.person.husband}</h3><div class="summary-row"><span>${H.income}</span><span>${rm(ps)}</span></div><div class="summary-row"><span>${H.commitment}</span><span style="color:var(--ora)">-${rm(ks)}</span></div><div class="summary-row"><span>${H.expense}</span><span style="color:var(--red)">-${rm(es)}</span></div><div class="summary-row"><span>${H.balance}</span><span>${rm(bs)}</span></div></div><div><h3>${t.person.wife}</h3><div class="summary-row"><span>${H.income}</span><span>${rm(pi)}</span></div><div class="summary-row"><span>${H.commitment}</span><span style="color:var(--ora)">-${rm(ki)}</span></div><div class="summary-row"><span>${H.expense}</span><span style="color:var(--red)">-${rm(ei)}</span></div><div class="summary-row"><span>${H.balance}</span><span>${rm(bi)}</span></div></div></div></div><div class="security-card"><h3>${T().security.title}</h3><div class="lock-info"><span class="li-icon">⏱️</span><span>${T().security.autoLock} <strong>${AUTO_LOCK_MIN} ${T().security.minutes}</strong></span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="showChangePw()">${T().security.changePw}</button><button class="btn btn-outline btn-sm" onclick="lockApp()">${T().security.lockNow}</button></div></div>`}

function renderPendapatan(){let el=document.getElementById('tab-pendapatan');if(!el||!el.classList.contains('active'))return;let t=T(),I=t.income,d=gd();if(!d)return;let html=`<div class="card"><h2>${I.title} — ${currentMonth}</h2>${personToggle()}<h3>${I.salary}</h3><div class="grid-2"><div class="form-group"><label>${I.salaryLabel}</label><input type="number" value="${d.gaji||''}" placeholder="0.00" onchange="updGaji(this.value)" step="0.01"></div><div style="display:flex;align-items:end"><div class="metric-card green" style="width:100%;padding:12px"><div class="mc-label">${I.totalSalary}</div><div class="mc-value">${rm(d.gaji)}</div></div></div></div><h3>${I.extra}</h3><div class="expand-controls"><button onclick="expandGroup('wt_',WT_KEYS)">${I.expandAll}</button><button onclick="collapseGroup('wt_',WT_KEYS)">${I.collapseAll}</button></div>`;WT_KEYS.forEach((w,i)=>{let entries=d.wangTambahan[w]||[],ct=wtCatTotal(currentPerson,w),secId='wt_'+ci(w),fid='wtf_'+w;let addBtn=`<button class="btn-add-circle gold" onclick="event.stopPropagation();openForm('${secId}','${fid}','wtf_amt_${w}')">+</button>`;let body=addFormHTML(fid,'wtf_amt_'+w,'wtf_nota_'+w,'wtf_date_'+w,`addWT('${w}')`,`document.getElementById('${fid}').classList.remove('show')`,{amt:I.amtLabel,nota:I.notaLabel,ph:I.notaPlaceholder,date:I.dateLabel,add:I.add,cancel:I.cancel});body+=entryListHTML(entries,'wt',currentPerson,w);html+=collapseHTML(secId,wtLabel(i),ct,entries.length,true,body,addBtn)});html+=`<div class="total-bar" style="background:var(--g6)"><span class="tb-label">${I.extraTotal}:</span><span class="tb-value" style="color:#e65100">${rm(totalWT())}</span></div><div class="total-bar"><span class="tb-label">${I.grandTotal}:</span><span class="tb-value" style="color:var(--g1)">${rm(totalPendapatan())}</span></div></div>`;el.innerHTML=html}
function updGaji(v){let d=gd();if(d){d.gaji=parseFloat(v)||0;saveData();renderActiveTab()}}
function addWT(key){let amt=parseFloat(document.getElementById('wtf_amt_'+key).value),nota=document.getElementById('wtf_nota_'+key).value.trim(),dateVal=document.getElementById('wtf_date_'+key).value||todayISO();if(!amt||amt<=0){showToast(T().msg.enterAmount);return}if(!nota){showToast(T().msg.notaRequired);return}let d=gd();if(!d)return;if(!Array.isArray(d.wangTambahan[key]))d.wangTambahan[key]=[];let s=makeStamp(dateVal);d.wangTambahan[key].push({id:gid(),amount:amt,nota,date:s.date,time:s.time,ts:s.ts});expanded['wt_'+ci(key)]=true;saveDataNow();showToast(T().msg.added);renderActiveTab()}

function renderKomitmen(){let el=document.getElementById('tab-komitmen');if(!el||!el.classList.contains('active'))return;let t=T(),K=t.kom,d=gd();if(!d)return;let cats=data.categories.komitmen;let html=`<div class="card"><h2>${K.title} — ${currentMonth}</h2>${personToggle()}<p style="font-size:.82rem;color:var(--gr3);margin-bottom:10px">${K.hint}</p><div class="expand-controls"><button onclick="expandGroup('km_',${JSON.stringify(cats).replace(/"/g,"'")})">${K.expandAll}</button><button onclick="collapseGroup('km_',${JSON.stringify(cats).replace(/"/g,"'")})">${K.collapseAll}</button></div>`;cats.forEach(k=>{let obj=migrateKom(d.komitmen[k]),secId='km_'+ci(k),iso=displayToISO(obj.date)||todayISO();let body=`<div style="padding:4px 0"><div class="kom-fields"><div class="form-group"><label>${K.amountLabel}</label><input type="number" id="${secId}_amt" value="${obj.amount||''}" placeholder="0.00" step="0.01" onchange="updKom('${esc(k)}')"></div><div class="form-group"><label>${K.notaLabel}</label><input type="text" id="${secId}_nota" value="${obj.nota||''}" placeholder="${K.notaPlaceholder}" onchange="updKom('${esc(k)}')"></div><div class="form-group"><label>${K.dateLabel}</label><input type="date" id="${secId}_date" value="${iso}" onchange="updKom('${esc(k)}')"></div></div>${obj.date?`<div class="kom-date-badge">📅 ${K.updated}: ${obj.date} ${obj.time}</div>`:''}${obj.nota?`<div class="kom-nota-display">📝 ${obj.nota}</div>`:''}</div>`;html+=collapseHTML(secId,k,obj.amount,obj.date?'✓':'—',false,body,'')});html+=`<div class="total-bar"><span class="tb-label">${K.total}:</span><span class="tb-value" style="color:var(--ora)">${rm(totalKomitmen())}</span></div></div>`;el.innerHTML=html}
function updKom(cat){let secId='km_'+ci(cat),amt=parseFloat(document.getElementById(secId+'_amt').value)||0,nota=document.getElementById(secId+'_nota').value.trim(),dateVal=document.getElementById(secId+'_date').value||todayISO();let d=gd();if(!d)return;let s=makeStamp(dateVal);d.komitmen[cat]={amount:amt,nota,date:s.date,time:s.time,ts:s.ts};saveData();showToast(T().msg.updated)}

function exportExcel(){let rows=getExportRows(),html='<html><head><meta charset="UTF-8"></head><body><table border="1">';rows.forEach((r,i)=>{html+='<tr>';r.forEach(c=>{html+=(i===0?'<th>':'<td>')+c+(i===0?'</th>':'</td>')});html+='</tr>'});html+='</table></body></html>';downloadFile(html,'budget_'+currentMonth+'.xls','application/vnd.ms-excel');showToast(T().msg.exported)}
function exportPDF(){try{const{jsPDF}=window.jspdf;let doc=new jsPDF('l');doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Budget - '+currentMonth,14,20);let rows=getExportRows();doc.autoTable({head:[rows[0]],body:rows.slice(1),startY:28,styles:{fontSize:7,cellPadding:3},headStyles:{fillColor:[46,125,50]},alternateRowStyles:{fillColor:[232,245,233]}});doc.save('budget_'+currentMonth+'.pdf');showToast(T().msg.exported)}catch(e){showToast('⚠️ '+e.message)}}
function downloadFile(c,f,tp){let b=new Blob([c],{type:tp+';charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;a.click();URL.revokeObjectURL(a.href)}
function exportAllJSON(){downloadFile(JSON.stringify(data,null,2),'budget_backup.json','application/json');showToast(T().msg.exported)}
function importJSON(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){try{let p=JSON.parse(e.target.result);if(p&&p.months){data=p;if(data.lang)lang=data.lang;saveDataNow();initMonth(currentMonth);setLang(lang);renderActiveTab();showToast(T().msg.imported)}else showToast(T().msg.invalidFile)}catch(err){showToast(T().msg.invalidFile)}};r.readAsText(f);ev.target.value=''}
function resetAllData(){let t=T();if(!confirm(t.msg.confirmReset))return;if(!confirm(t.msg.confirmSure))return;localStorage.removeItem(STORE_KEY);localStorage.removeItem(BACKUP_KEY);data={categories:{komitmen:[...DEF_KOM],perbelanjaan:[...DEF_EXP]},months:{},lang};initMonth(currentMonth);saveDataNow();renderActiveTab();showToast(t.msg.reset)}
function showToast(msg){let x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}

// ===== INIT APP (called after login) =====
function initApp(){
loadData();
if(!data.categories)data.categories={komitmen:[...DEF_KOM],perbelanjaan:[...DEF_EXP]};
currentMonth=MONTHS[new Date().getMonth()];
initMonth(currentMonth);
document.getElementById('monthSelect').innerHTML=MONTHS.map(m=>`<option value="${m}"${m===currentMonth?' selected':''}>${m}</option>`).join('');
document.getElementById('mainContent').innerHTML=TAB_IDS.map(id=>`<div class="tab-content" id="tab-${id}"></div>`).join('');
document.getElementById('langBM').classList.toggle('active',lang==='bm');
document.getElementById('langEN').classList.toggle('active',lang==='en');
updateHeader();buildDrawerNav();switchTab('dashboard');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')safeSave()});
window.addEventListener('beforeunload',()=>safeSave());
}

// ===== BOOT =====
window.addEventListener('DOMContentLoaded',()=>{
let session=getSession();
let auth=getAuth();
if(auth&&session&&session.active){
enterApp();
}else{
showLoginPage();
}
});
</script>
</body>
</html>
