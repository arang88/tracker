<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g1:#1b5e20;--g2:#2e7d32;--g3:#4caf50;--g4:#81c784;--g5:#c8e6c9;--g6:#e8f5e9;--w:#fff;--gr1:#333;--gr2:#555;--gr3:#888;--gr5:#e0e0e0;--gr6:#f5f5f5;--red:#e53935;--ora:#ff9800;--blu:#1976d2;--sidebar-w:260px}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--gr6);color:var(--gr1);line-height:1.5;min-height:100vh}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1b5e20 0%,#2e7d32 30%,#4caf50 60%,#81c784 100%);padding:20px}
.login-card{background:var(--w);border-radius:20px;padding:40px 32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-card .lc-icon{font-size:3.5rem;margin-bottom:12px}
.login-card h1{font-size:1.3rem;color:var(--g1);margin-bottom:4px;font-weight:800}
.login-card .lc-sub{font-size:.82rem;color:var(--gr3);margin-bottom:28px}
.login-card .lc-error{background:#ffebee;color:#c62828;padding:10px 14px;border-radius:8px;font-size:.82rem;font-weight:600;margin-bottom:14px;display:none}
.login-card .lc-error.show{display:block}
.login-card .lc-success{background:#e8f5e9;color:#1b5e20;padding:10px 14px;border-radius:8px;font-size:.82rem;font-weight:600;margin-bottom:14px;display:none}
.login-card .lc-success.show{display:block}
.login-input-group{position:relative;margin-bottom:16px;text-align:left}
.login-input-group label{display:block;font-size:.78rem;color:var(--gr2);font-weight:600;margin-bottom:6px}
.login-input-group input{width:100%;padding:12px 44px 12px 14px;border:2px solid var(--gr5);border-radius:10px;font-size:.95rem;transition:.2s;background:var(--gr6)}
.login-input-group input:focus{outline:none;border-color:var(--g3);background:var(--w);box-shadow:0 0 0 4px rgba(76,175,80,.15)}
.login-input-group .toggle-pw{position:absolute;right:12px;top:32px;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--gr3);padding:4px}
.login-input-group .pw-strength{height:4px;border-radius:2px;margin-top:6px;transition:all .3s}
.login-remember{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:.82rem;color:var(--gr2)}
.login-remember input{width:16px;height:16px;accent-color:var(--g3)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--g1),var(--g3));color:var(--w);border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(27,94,32,.35)}
.login-footer{margin-top:24px;font-size:.72rem;color:var(--gr3)}
.login-divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:.75rem;color:var(--gr3)}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--gr5)}
.app-container{display:none}.app-container.show{display:block}
.btn-lock{background:none;border:2px solid rgba(255,255,255,.4);color:var(--w);font-size:.9rem;width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.btn-lock:hover{background:rgba(255,255,255,.15);border-color:var(--w)}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--w);padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header-left{display:flex;align-items:center;gap:10px}
header h1{font-size:1rem;font-weight:700}
.hamburger{background:none;border:2px solid rgba(255,255,255,.5);color:var(--w);font-size:1.3rem;width:38px;height:38px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.hamburger:hover{background:rgba(255,255,255,.15);border-color:var(--w)}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.month-sel select{padding:5px 10px;border:none;border-radius:6px;font-size:.84rem;background:var(--w);color:var(--g2);font-weight:600;cursor:pointer}
.lang-toggle{display:flex;border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,.4);flex-shrink:0}
.lang-toggle button{padding:4px 10px;border:none;background:transparent;color:rgba(255,255,255,.7);font-size:.72rem;font-weight:700;cursor:pointer;transition:.2s}
.lang-toggle button.active{background:rgba(255,255,255,.25);color:var(--w)}
.active-tab-indicator{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.active-tab-indicator:hover{background:rgba(255,255,255,.25)}
.sync-badge{font-size:.65rem;padding:3px 8px;border-radius:10px;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap}
.sync-badge.synced{background:rgba(255,255,255,.2);color:#a5d6a7}
.sync-badge.syncing{background:var(--ora);color:var(--w);animation:pulse 1s infinite}
.sync-badge.offline{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.sync-badge.error{background:var(--red);color:var(--w)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;visibility:hidden;transition:opacity .3s;backdrop-filter:blur(2px)}
.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--w);z-index:201;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.15)}
.drawer.open{transform:translateX(0)}
.drawer-header{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--w);padding:20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.drawer-header h2{font-size:1rem;font-weight:700}
.drawer-close{background:none;border:none;color:var(--w);font-size:1.5rem;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.drawer-close:hover{background:rgba(255,255,255,.2)}
.drawer-nav{flex:1;overflow-y:auto;padding:8px 0}
.drawer-nav button{width:100%;display:flex;align-items:center;gap:14px;padding:14px 20px;border:none;background:none;text-align:left;font-size:.88rem;color:var(--gr2);cursor:pointer;transition:.15s;font-weight:500;border-left:4px solid transparent}
.drawer-nav button:hover{background:var(--g6);color:var(--g2)}
.drawer-nav button.active{background:var(--g6);color:var(--g1);font-weight:700;border-left-color:var(--g3)}
.drawer-nav button .nav-icon{font-size:1.2rem;width:28px;text-align:center;flex-shrink:0}
.drawer-footer{padding:14px 20px;border-top:1px solid var(--gr5);font-size:.72rem;color:var(--gr3);text-align:center;flex-shrink:0}
main{max-width:1000px;margin:0 auto;padding:16px}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:var(--w);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid var(--gr5)}
.card h2{font-size:1.02rem;color:var(--g2);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--g5);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:.92rem;color:var(--g1);margin:14px 0 10px}
.person-toggle{display:flex;gap:0;margin-bottom:16px;border-radius:8px;overflow:hidden;border:2px solid var(--g3)}
.person-toggle button{flex:1;padding:10px 14px;border:none;background:var(--w);color:var(--g2);font-weight:600;cursor:pointer;font-size:.86rem;transition:.2s}
.person-toggle button.active{background:var(--g3);color:var(--w)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.76rem;color:var(--gr2);font-weight:600;word-break:break-word}
.form-group input,.form-group select{padding:9px 11px;border:1.5px solid var(--gr5);border-radius:8px;font-size:.86rem;transition:.2s;width:100%;min-width:0}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--g3);box-shadow:0 0 0 3px rgba(76,175,80,.15)}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.84rem;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--g3);color:var(--w)}.btn-primary:hover{background:var(--g2)}
.btn-danger{background:var(--red);color:var(--w)}.btn-danger:hover{background:#c62828}
.btn-warning{background:var(--ora);color:var(--w)}.btn-warning:hover{background:#f57c00}
.btn-outline{background:var(--w);color:var(--g2);border:1.5px solid var(--g3)}.btn-outline:hover{background:var(--g6)}
.btn-sm{padding:5px 10px;font-size:.76rem;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:.72rem;border-radius:4px}
.btn-add-circle{width:30px;height:30px;border-radius:50%;background:var(--g3);color:var(--w);border:none;font-size:1rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.btn-add-circle:hover{background:var(--g2);transform:scale(1.1)}
.btn-add-circle.gold{background:var(--ora)}.btn-add-circle.gold:hover{background:#f57c00}
.btn-edit{width:26px;height:26px;border-radius:50%;background:var(--blu);color:var(--w);border:none;font-size:.7rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.btn-edit:hover{background:#1565c0;transform:scale(1.1)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric-card{background:var(--w);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--gr5);box-shadow:0 1px 3px rgba(0,0,0,.06);transition:.2s}
.metric-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.1);transform:translateY(-1px)}
.metric-card .mc-icon{font-size:1.4rem;margin-bottom:5px}
.metric-card .mc-label{font-size:.7rem;color:var(--gr3);font-weight:600;text-transform:uppercase;margin-bottom:4px;word-break:break-word}
.metric-card .mc-value{font-size:1.1rem;font-weight:700;color:var(--g1)}
.metric-card.green{border-left:4px solid var(--g3)}.metric-card.red{border-left:4px solid var(--red)}.metric-card.orange{border-left:4px solid var(--ora)}.metric-card.blue{border-left:4px solid var(--blu)}
.health-bar{height:22px;background:var(--gr5);border-radius:11px;overflow:hidden;margin:8px 0}
.health-bar-fill{height:100%;border-radius:11px;transition:width .5s;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--w);min-width:30px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gr5);font-size:.88rem}
.summary-row:last-child{border:none;font-weight:700;font-size:1rem;color:var(--g1);padding-top:12px;border-top:2px solid var(--g3)}
.collapse-section{margin-bottom:8px;border:1px solid var(--gr5);border-radius:10px;overflow:hidden;background:var(--w)}
.collapse-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gr6);cursor:pointer;gap:8px;transition:background .15s;user-select:none}
.collapse-header:hover{background:var(--g6)}
.collapse-header.income-header{background:linear-gradient(135deg,#fff8e1,#fff3e0)}
.collapse-header.income-header:hover{background:#fff3e0}
.collapse-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.collapse-arrow{font-size:.8rem;transition:transform .25s;flex-shrink:0;width:20px;text-align:center;color:var(--gr3)}
.collapse-arrow.open{transform:rotate(90deg)}
.collapse-name{font-weight:600;font-size:.86rem;color:var(--gr1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collapse-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.collapse-total{font-weight:700;font-size:.92rem;color:var(--g2);white-space:nowrap}
.collapse-total.gold{color:#e65100}
.collapse-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:12px;background:var(--g3);color:var(--w);font-size:.68rem;font-weight:700}
.collapse-count.zero{background:var(--gr5);color:var(--gr3)}.collapse-count.gold{background:var(--ora)}
.collapse-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1),padding .25s}
.collapse-body.open{max-height:3000px;padding:8px 12px 12px}
.entry-item{display:flex;align-items:center;padding:8px 10px;font-size:.8rem;border-bottom:1px solid var(--gr5);gap:6px;flex-wrap:wrap;transition:background .15s}
.entry-item:last-child{border-bottom:none}.entry-item:hover{background:var(--g6)}
.entry-item .ei-amount{font-weight:600;color:var(--g2);white-space:nowrap;min-width:75px}
.entry-item .ei-nota{color:var(--gr2);font-style:italic;flex:1;min-width:50px;word-break:break-word}
.entry-item .ei-date{color:var(--gr3);font-size:.72rem;white-space:nowrap}
.entry-item .ei-actions{display:flex;gap:4px;flex-shrink:0}
.add-form{background:var(--g6);border-radius:8px;padding:12px;margin:8px 0 4px;display:none;border:1.5px dashed var(--g4)}
.add-form.show{display:block}
.add-form .af-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.add-form .af-row .form-group{flex:1;min-width:100px}
.kom-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kom-date-badge{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:4px 10px;background:var(--g5);border-radius:6px;font-size:.7rem;color:var(--g1);font-weight:600}
.kom-nota-display{font-size:.74rem;color:var(--gr2);font-style:italic;margin-top:4px}
.log-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.log-table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:580px}
table.log-table th{background:var(--g2);color:var(--w);padding:9px 10px;text-align:left;font-size:.76rem;white-space:nowrap}
table.log-table td{padding:7px 10px;border-bottom:1px solid var(--gr5);word-break:break-word}
table.log-table tr:nth-child(even){background:var(--g6)}
table.log-table tr:hover{background:var(--g5)}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:.68rem;font-weight:700}
.badge-s{background:#bbdefb;color:#1565c0}.badge-i{background:#f8bbd0;color:#c62828}.badge-kom{background:#fff3e0;color:#e65100}.badge-exp{background:#e8f5e9;color:#1b5e20}.badge-inc{background:#fff9c4;color:#f57f17}
.log-filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.log-filters button{padding:5px 12px;border-radius:20px;border:1.5px solid var(--gr5);background:var(--w);font-size:.76rem;font-weight:600;cursor:pointer;transition:.2s;color:var(--gr2)}
.log-filters button.active{background:var(--g3);color:var(--w);border-color:var(--g3)}
.show-more-bar{text-align:center;padding:12px;border-top:1px solid var(--gr5)}
.sim-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gr6);border-radius:8px;margin-bottom:6px}
.sim-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--g3);flex-shrink:0}
.sim-item .si-name{flex:1;font-size:.86rem;font-weight:500;word-break:break-word}
.sim-item .si-amt{font-weight:700;color:var(--g2);white-space:nowrap}
.sim-result{background:var(--g6);border:2px solid var(--g3);border-radius:10px;padding:20px;text-align:center;margin-top:16px}
.sim-result .sr-label{font-size:.88rem;color:var(--gr2)}.sim-result .sr-value{font-size:1.8rem;font-weight:800;color:var(--g1)}
.chart-container{position:relative;width:100%;max-width:100%}
.chart-container canvas{max-width:100%;height:auto!important}
.cat-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gr6);border-radius:8px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.cat-list-item .cli-name{font-weight:600;font-size:.86rem;flex:1;min-width:100px;word-break:break-word}
.export-btn-group{display:flex;gap:12px;flex-wrap:wrap}
.expand-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.expand-controls button{padding:6px 14px;border-radius:20px;border:1.5px solid var(--g4);background:var(--w);font-size:.74rem;font-weight:600;cursor:pointer;color:var(--g2);transition:.15s}
.expand-controls button:hover{background:var(--g6);border-color:var(--g3)}
.total-bar{margin-top:16px;padding:14px;background:var(--g5);border-radius:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.total-bar .tb-label{font-weight:700;font-size:1.02rem}.total-bar .tb-value{font-weight:800;font-size:1.05rem}
.no-entries{text-align:center;padding:16px;color:var(--gr3);font-size:.82rem}
.toast{position:fixed;bottom:20px;right:20px;background:var(--g2);color:var(--w);padding:12px 20px;border-radius:8px;font-size:.84rem;font-weight:600;z-index:999;transform:translateY(100px);opacity:0;transition:.3s;max-width:90vw}
.toast.show{transform:translateY(0);opacity:1}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-overlay.show{display:flex}
.modal{background:var(--w);border-radius:14px;padding:24px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.modal h3{color:var(--g2);margin-bottom:16px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.modal .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.cloud-card{background:linear-gradient(135deg,#e3f2fd,#bbdefb);border:1px solid #90caf9;border-radius:12px;padding:20px;margin-bottom:16px}
.cloud-card h3{color:#1565c0;margin-bottom:12px;font-size:.95rem}
.cloud-status{display:flex;align-items:center;gap:10px;padding:12px;background:var(--w);border-radius:8px;margin-bottom:12px}
.cloud-status .cs-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.cloud-status .cs-dot.online{background:#4caf50}.cloud-status .cs-dot.offline{background:var(--gr5)}
.security-card{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:1px solid #a5d6a7;border-radius:12px;padding:20px;margin-bottom:16px}
.security-card h3{color:var(--g1);margin-bottom:12px}
@media(max-width:600px){
header h1{font-size:.85rem}.header-right{gap:4px}
.metric-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.metric-card{padding:10px}.metric-card .mc-value{font-size:.92rem}.metric-card .mc-label{font-size:.66rem}
main{padding:10px}.card{padding:14px;border-radius:10px}
.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr 1fr}
.kom-fields{grid-template-columns:1fr}
.add-form .af-row{flex-direction:column}.add-form .af-row .form-group{min-width:100%}
.person-toggle button{font-size:.8rem;padding:8px 10px}
.drawer{width:78vw;max-width:280px}
.active-tab-indicator{font-size:.72rem;padding:4px 8px}
.lang-toggle button{padding:3px 7px;font-size:.68rem}
.collapse-name{font-size:.8rem}.collapse-total{font-size:.84rem}.modal{padding:18px}
.login-card{padding:28px 22px}.login-card h1{font-size:1.1rem}
}
@media print{header,.hamburger,.drawer,.drawer-overlay,.btn,.btn-add-circle,.btn-edit,.add-form,.person-toggle,.toast,.active-tab-indicator,.lang-toggle,.expand-controls,.modal-overlay,.btn-lock,.login-page,.sync-badge{display:none!important}.tab-content{display:block!important}.app-container{display:block!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}.collapse-body{max-height:none!important;padding:8px 12px!important}}
</style>
</head>
<body>
<div class="login-page" id="loginPage">

<script>
// ==================== FIREBASE REAL-TIME SYNC ====================
const FB_CONFIG_KEY='hbudget_fb_config';
let fbApp=null,fbDb=null,fbRef=null,fbConnected=false,syncTimer=null,isSyncing=false,lastPushTs=0;

function getFbConfig(){try{return JSON.parse(localStorage.getItem(FB_CONFIG_KEY))}catch(e){return null}}
function setFbConfig(c){localStorage.setItem(FB_CONFIG_KEY,JSON.stringify(c))}

function initFirebase(){
let cfg=getFbConfig();
if(!cfg||!cfg.databaseURL)return;
try{
if(fbApp){try{fbApp.delete()}catch(e){}}
fbApp=firebase.initializeApp({apiKey:cfg.apiKey||'',databaseURL:cfg.databaseURL,projectId:cfg.projectId||''},'budgetApp');
fbDb=firebase.database(fbApp);
let auth=getAuth();
let userId=auth?auth.hash.substring(0,16):'default';
fbRef=fbDb.ref('budgetData/'+userId);
fbDb.ref('.info/connected').on('value',snap=>{
fbConnected=snap.val()===true;
updateSyncBadge(fbConnected?'online':'offline');
});
// REAL-TIME LISTENER
fbRef.on('value',snap=>{
let cloud=snap.val();
if(!cloud||!cloud.months)return;
let localTs=data._lastSaved||0;
let cloudTs=cloud._cloudTs||0;
if(cloudTs>localTs+3000&&cloudTs!==lastPushTs){
console.log('Cloud newer, updating...');
data=cloud;data._lastSaved=cloudTs;
if(data.lang)lang=data.lang;
safeSave();initMonth(currentMonth);renderActiveTab();
updateSyncBadge('synced');
showToast('☁️ Data dikemaskini');
}else{updateSyncBadge('synced')}
});
console.log('Firebase real-time sync active');
}catch(e){console.error('FB init error:',e);updateSyncBadge('error')}
}

function updateSyncBadge(s){
let el=document.getElementById('syncBadge');if(!el)return;
el.className='sync-badge';
if(s==='synced'){el.classList.add('synced');el.textContent='☁️ ✅'}
else if(s==='syncing'){el.classList.add('syncing');el.textContent='☁️ ...'}
else if(s==='online'){el.classList.add('synced');el.textContent='☁️ Online'}
else if(s==='error'){el.classList.add('error');el.textContent='☁️ ❌'}
else{el.classList.add('offline');el.textContent='☁️ —'}
}

function pushToCloud(){
if(!fbRef||!fbConnected||isSyncing)return;
isSyncing=true;updateSyncBadge('syncing');
let payload=JSON.parse(JSON.stringify(data));
let now=Date.now();payload._cloudTs=now;lastPushTs=now;
data._lastSaved=now;safeSave();
fbRef.set(payload).then(()=>{updateSyncBadge('synced');isSyncing=false})
.catch(e=>{console.error('Push err:',e);updateSyncBadge('error');isSyncing=false});
}

function pullFromCloud(){
if(!fbRef||isSyncing)return;
isSyncing=true;updateSyncBadge('syncing');
fbRef.once('value').then(snap=>{
let cloud=snap.val();
if(!cloud||!cloud.months){isSyncing=false;updateSyncBadge('synced');return}
data=cloud;data._lastSaved=cloud._cloudTs||Date.now();
if(data.lang)lang=data.lang;
safeSave();initMonth(currentMonth);renderActiveTab();
updateSyncBadge('synced');showToast('☁️ Data dimuat');isSyncing=false;
}).catch(e=>{console.error('Pull err:',e);updateSyncBadge('error');isSyncing=false});
}

function schedulePush(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushToCloud(),3000)}
function manualSync(){if(!fbRef){showToast('⚠️ Firebase belum setup');return}if(!fbConnected){showToast('⚠️ Tiada internet');return}pushToCloud();showToast('☁️ Syncing...')}

// ==================== AUTH ====================
const AUTH_KEY='hbudget_auth',SESSION_KEY='hbudget_session';
let inactivityTimer=null;const AUTO_LOCK_MIN=15;

async function hashPassword(pw){
const str=pw+'_hbudget_salt_2024';
if(window.crypto&&window.crypto.subtle){
try{const enc=new TextEncoder();const d=enc.encode(str);const h=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){console.warn('crypto fallback')}
}
let h1=0,h2=0;
for(let i=0;i<str.length;i++){h1=((h1<<5)-h1)+str.charCodeAt(i);h1=h1&h1}
for(let i=str.length-1;i>=0;i--){h2=((h2<<7)-h2)+str.charCodeAt(i);h2=h2&h2}
return'fb'+Math.abs(h1).toString(16).padStart(8,'0')+Math.abs(h2).toString(16).padStart(8,'0')+str.length.toString(16).padStart(4,'0');
}

function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY))}catch(e){return null}}
function setAuth(o){localStorage.setItem(AUTH_KEY,JSON.stringify(o))}
function getSession(){try{let s=JSON.parse(localStorage.getItem(SESSION_KEY));if(s&&s.expires&&Date.now()>s.expires)return null;return s}catch(e){return null}}
function setSession(rem){localStorage.setItem(SESSION_KEY,JSON.stringify({active:true,expires:Date.now()+(rem?604800000:7200000),ts:Date.now()}))}
function clearSession(){localStorage.removeItem(SESSION_KEY)}

function showLoginPage(){document.getElementById('loginPage').style.display='flex';document.getElementById('appContainer').classList.remove('show');getAuth()?renderLoginForm():renderSetupForm()}
function renderSetupForm(){document.getElementById('loginTitle').textContent='🔐 Buat Kata Laluan';document.getElementById('loginSub').textContent='Tetapkan kata laluan';document.getElementById('loginForm').innerHTML=`<div class="login-input-group"><label>Kata Laluan Baru</label><input type="password" id="setupPw1" placeholder="Min 4 aksara" onkeyup="checkStr(this.value)" onkeydown="if(event.key==='Enter')document.getElementById('setupPw2').focus()"><button class="toggle-pw" onclick="togPw('setupPw1',this)">👁️</button><div class="pw-strength" id="pwStr" style="background:var(--gr5)"></div></div><div class="login-input-group"><label>Sahkan</label><input type="password" id="setupPw2" placeholder="Masuk semula" onkeydown="if(event.key==='Enter')doSetup()"><button class="toggle-pw" onclick="togPw('setupPw2',this)">👁️</button></div><div class="login-remember"><input type="checkbox" id="setupRem" checked><label for="setupRem">Ingat 7 hari</label></div><button class="login-btn" onclick="doSetup()">🔐 Tetapkan & Masuk</button>`;setTimeout(()=>document.getElementById('setupPw1').focus(),300)}
function renderLoginForm(){document.getElementById('loginTitle').textContent='🔐 Budget Tracker';document.getElementById('loginSub').textContent='Masukkan kata laluan';document.getElementById('loginError').classList.remove('show');document.getElementById('loginSuccess').classList.remove('show');document.getElementById('loginForm').innerHTML=`<div class="login-input-group"><label>Kata Laluan</label><input type="password" id="loginPw" placeholder="Kata laluan" onkeydown="if(event.key==='Enter')doLogin()"><button class="toggle-pw" onclick="togPw('loginPw',this)">👁️</button></div><div class="login-remember"><input type="checkbox" id="loginRem" checked><label for="loginRem">Ingat 7 hari</label></div><button class="login-btn" onclick="doLogin()">🔓 Masuk</button><div class="login-divider">atau</div><button class="btn btn-outline btn-sm" onclick="showReset()" style="width:100%;justify-content:center;color:var(--red);border-color:var(--red)">🗑️ Reset Semua</button>`;setTimeout(()=>document.getElementById('loginPw').focus(),300)}
async function doSetup(){let p1=document.getElementById('setupPw1').value,p2=document.getElementById('setupPw2').value,err=document.getElementById('loginError'),suc=document.getElementById('loginSuccess');err.classList.remove('show');suc.classList.remove('show');if(p1.length<4){err.textContent='⚠️ Min 4 aksara';err.classList.add('show');return}if(p1!==p2){err.textContent='⚠️ Tidak sepadan';err.classList.add('show');return}setAuth({hash:await hashPassword(p1),created:Date.now()});setSession(document.getElementById('setupRem').checked);suc.textContent='✅ Berjaya!';suc.classList.add('show');setTimeout(enterApp,500)}
async function doLogin(){let pw=document.getElementById('loginPw').value,err=document.getElementById('loginError');err.classList.remove('show');if(!pw){err.textContent='⚠️ Masukkan kata laluan';err.classList.add('show');return}let h=await hashPassword(pw),a=getAuth();if(!a||h!==a.hash){err.textContent='❌ Salah';err.classList.add('show');document.getElementById('loginPw').value='';return}setSession(document.getElementById('loginRem').checked);enterApp()}
function showReset(){if(!confirm('⚠️ PADAM semua?'))return;if(!confirm('PASTI?'))return;localStorage.removeItem(AUTH_KEY);localStorage.removeItem(SESSION_KEY);localStorage.removeItem(STORE_KEY);localStorage.removeItem(BACKUP_KEY);renderSetupForm();document.getElementById('loginSuccess').textContent='🔄 Reset selesai';document.getElementById('loginSuccess').classList.add('show')}
function enterApp(){document.getElementById('loginPage').style.display='none';document.getElementById('appContainer').classList.add('show');startInact();initApp()}
function lockApp(){safeSave();pushToCloud();clearSession();stopInact();document.getElementById('appContainer').classList.remove('show');document.getElementById('loginPage').style.display='flex';renderLoginForm()}
function togPw(id,b){let i=document.getElementById(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁️':'🙈'}
function checkStr(pw){let b=document.getElementById('pwStr');if(!b)return;let s=0;if(pw.length>=4)s++;if(pw.length>=8)s++;if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^a-zA-Z0-9]/.test(pw))s++;let c=['#e53935','#ff9800','#ff9800','#4caf50','#1b5e20'],w=['20%','40%','60%','80%','100%'];let i=Math.min(s,4);b.style.width=w[i];b.style.background=c[i]}
function startInact(){stopInact();['mousedown','mousemove','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e,resetInact,{passive:true}));resetInact()}
function stopInact(){clearTimeout(inactivityTimer);['mousedown','mousemove','keydown','touchstart','scroll'].forEach(e=>document.removeEventListener(e,resetInact))}
function resetInact(){clearTimeout(inactivityTimer);inactivityTimer=setTimeout(()=>{showToast('🔒 Auto-lock');setTimeout(lockApp,1500)},AUTO_LOCK_MIN*60000)}
async function showChangePw(){openModal(`<h3>🔑 Tukar Password</h3><div class="form-group" style="margin-bottom:10px"><label>Semasa</label><input type="password" id="cpw_old"></div><div class="form-group" style="margin-bottom:10px"><label>Baru</label><input type="password" id="cpw_new"></div><div class="form-group" style="margin-bottom:10px"><label>Sahkan</label><input type="password" id="cpw_con"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="doChangePw()">💾 Simpan</button></div>`)}
async function doChangePw(){let o=document.getElementById('cpw_old').value,n=document.getElementById('cpw_new').value,c=document.getElementById('cpw_con').value,a=getAuth();if(!a)return;if(await hashPassword(o)!==a.hash){showToast('❌ Salah');return}if(n.length<4){showToast('⚠️ Min 4');return}if(n!==c){showToast('⚠️ Tak sepadan');return}setAuth({hash:await hashPassword(n),created:Date.now()});closeModal();showToast('✅ Ditukar');initFirebase()}

// ==================== DATA ====================
const STORE_KEY='hbudget_v9',BACKUP_KEY='hbudget_v9_backup';
let saveTimr=null,isSaving=false,renderTimr=null;
function safeSave(){if(isSaving)return;isSaving=true;try{let j=JSON.stringify(data);if(!j||j.length<10){isSaving=false;return}let ex=localStorage.getItem(STORE_KEY);if(ex&&ex.length>50)localStorage.setItem(BACKUP_KEY,ex);localStorage.setItem(STORE_KEY,j)}catch(e){console.error(e)}isSaving=false}
function saveData(){data.lang=lang;data._lastSaved=Date.now();clearTimeout(saveTimr);saveTimr=setTimeout(()=>{safeSave();schedulePush()},300)}
function saveDataNow(){data.lang=lang;data._lastSaved=Date.now();safeSave();schedulePush()}
function loadData(){try{let d=localStorage.getItem(STORE_KEY);if(d){let p=JSON.parse(d);if(p&&p.months){data=p;if(data.lang)lang=data.lang;return}}}catch(e){}try{let b=localStorage.getItem(BACKUP_KEY);if(b){let p=JSON.parse(b);if(p&&p.months){data=p;if(data.lang)lang=data.lang;return}}}catch(e){}data={categories:{komitmen:[...DEF_KOM],perbelanjaan:[...DEF_EXP]},months:{},lang:'bm'}}

function T(){return L[lang]}
function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function todayISO(){return new Date().toISOString().split('T')[0]}
function nowTime(){let d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function i2d(iso){if(!iso||iso==='-')return'-';let p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso}
function d2i(dd){if(!dd||dd==='-')return'';let p=dd.split('/');return p.length===3?p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0'):''}
function stamp(iso){return{date:i2d(iso||todayISO()),time:nowTime(),ts:Date.now()}}
function migK(o){if(typeof o==='number')return{amount:o,nota:'',date:'',time:'',ts:0};if(typeof o==='object'&&o!==null){o.amount=o.amount||0;o.nota=o.nota||'';o.date=o.date||'';o.time=o.time||'';o.ts=o.ts||0;return o}return{amount:0,nota:'',date:'',time:'',ts:0}}
function migW(o){if(typeof o==='number')return o>0?[{id:gid(),amount:o,nota:'Migrated',date:'',time:'',ts:0}]:[];return Array.isArray(o)?o:[]}
function initMonth(m){if(!data.months)data.months={};let isNew=!data.months[m];if(isNew)data.months[m]={suami:newP(),isteri:newP()};let md=data.months[m];['suami','isteri'].forEach(p=>{if(!md[p])md[p]=newP();if(!md[p].wangTambahan)md[p].wangTambahan={};WT_KEYS.forEach(w=>{md[p].wangTambahan[w]=migW(md[p].wangTambahan[w])});if(!md[p].komitmen)md[p].komitmen={};data.categories.komitmen.forEach(k=>{if(md[p].komitmen[k]===undefined)md[p].komitmen[k]={amount:0,nota:'',date:'',time:'',ts:0};else md[p].komitmen[k]=migK(md[p].komitmen[k])});if(!md[p].perbelanjaan)md[p].perbelanjaan={};data.categories.perbelanjaan.forEach(c=>{if(!md[p].perbelanjaan[c])md[p].perbelanjaan[c]=[]})});if(isNew)saveData()}
function newP(){let p={gaji:0,wangTambahan:{},komitmen:{},perbelanjaan:{}};WT_KEYS.forEach(w=>p.wangTambahan[w]=[]);data.categories.komitmen.forEach(k=>p.komitmen[k]={amount:0,nota:'',date:'',time:'',ts:0});data.categories.perbelanjaan.forEach(c=>p.perbelanjaan[c]=[]);return p}
function gd(p){return data.months[currentMonth]?data.months[currentMonth][p||currentPerson]:null}
function kA(o){return typeof o==='object'?(parseFloat(o.amount)||0):(parseFloat(o)||0)}
function wtCT(p,k){let d=gd(p);if(!d||!Array.isArray(d.wangTambahan[k]))return 0;return d.wangTambahan[k].reduce((a,e)=>a+(parseFloat(e.amount)||0),0)}
function tWT(p){let x=0;WT_KEYS.forEach(w=>x+=wtCT(p,w));return x}
function tInc(p){let d=gd(p);if(!d)return 0;return(parseFloat(d.gaji)||0)+tWT(p)}
function tKom(p){let d=gd(p);if(!d)return 0;return Object.values(d.komitmen).reduce((a,b)=>a+kA(b),0)}
function tExp(p){let d=gd(p);if(!d)return 0;let x=0;Object.values(d.perbelanjaan).forEach(a=>{if(Array.isArray(a))a.forEach(e=>x+=(parseFloat(e.amount)||0))});return x}
function tEC(p,cat){let d=gd(p);if(!d||!d.perbelanjaan[cat])return 0;return d.perbelanjaan[cat].reduce((a,e)=>a+(parseFloat(e.amount)||0),0)}
function bal(p){return tInc(p)-tKom(p)-tExp(p)}
function rm(v){return'RM '+(parseFloat(v)||0).toFixed(2)}
function pct(v,x){return x?((v/x)*100):0}
function wl(i){return T().income.cats[i]||WT_KEYS[i]}
function ci(s){return s.replace(/[^a-zA-Z0-9]/g,'_')}

function editEntry(type,person,cat,id){let d=data.months[currentMonth][person];if(!d)return;let e;if(type==='wt')e=(d.wangTambahan[cat]||[]).find(x=>x.id===id);else e=(d.perbelanjaan[cat]||[]).find(x=>x.id===id);if(!e)return;let E=T().edit,iso=d2i(e.date)||todayISO();openModal(`<h3>${E.title}</h3><div class="form-group" style="margin-bottom:10px"><label>${E.amtLabel}</label><input type="number" id="edit_amt" value="${e.amount}" step="0.01"></div><div class="form-group" style="margin-bottom:10px"><label>${E.notaLabel}</label><input type="text" id="edit_nota" value="${e.nota||''}"></div><div class="form-group" style="margin-bottom:10px"><label>${E.dateLabel}</label><input type="date" id="edit_date" value="${iso}"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">${E.cancel}</button><button class="btn btn-primary" onclick="saveEdit('${type}','${person}','${esc(cat)}','${id}')">${E.save}</button></div>`)}
function saveEdit(type,person,cat,id){let amt=parseFloat(document.getElementById('edit_amt').value),nota=document.getElementById('edit_nota').value.trim(),dt=document.getElementById('edit_date').value;if(!amt||amt<=0){showToast(T().msg.enterAmount);return}if(!nota){showToast(T().msg.notaRequired);return}let d=data.months[currentMonth][person];if(!d)return;let arr=type==='wt'?d.wangTambahan[cat]:d.perbelanjaan[cat];let e=(arr||[]).find(x=>x.id===id);if(e){e.amount=amt;e.nota=nota;e.date=i2d(dt);e.time=nowTime();e.ts=Date.now()}saveDataNow();closeModal();showToast(T().msg.edited);renderActiveTab()}

function delEnt(type,person,cat,id){if(!confirm(T().msg.confirmDel))return;let d=data.months[currentMonth][person];if(!d)return;if(type==='wt'&&Array.isArray(d.wangTambahan[cat]))d.wangTambahan[cat]=d.wangTambahan[cat].filter(e=>e.id!==id);if(type==='exp'&&Array.isArray(d.perbelanjaan[cat]))d.perbelanjaan[cat]=d.perbelanjaan[cat].filter(e=>e.id!==id);saveDataNow();showToast(T().msg.deleted);renderActiveTab()}

function addC(type){let t=T(),inp=document.getElementById(type==='komitmen'?'nkc':'nec'),name=inp.value.trim();if(!name){showToast(t.msg.enterName);return}if(data.categories[type].includes(name)){showToast(t.msg.alreadyExists);return}data.categories[type].push(name);MONTHS.forEach(m=>{if(data.months[m]){['suami','isteri'].forEach(p=>{if(data.months[m][p]){if(type==='komitmen'&&!data.months[m][p].komitmen[name])data.months[m][p].komitmen[name]={amount:0,nota:'',date:'',time:'',ts:0};if(type==='perbelanjaan'&&!data.months[m][p].perbelanjaan[name])data.months[m][p].perbelanjaan[name]=[]}})}});saveDataNow();inp.value='';showToast(t.msg.added);renderActiveTab()}
function edC(type,idx){let t=T(),old=data.categories[type][idx],nw=prompt(t.cat.editPrompt,old);if(!nw||nw.trim()===''||nw.trim()===old)return;nw=nw.trim();if(data.categories[type].includes(nw)){showToast(t.msg.alreadyExists);return}data.categories[type][idx]=nw;MONTHS.forEach(m=>{if(data.months[m]){['suami','isteri'].forEach(p=>{if(data.months[m][p]){if(type==='komitmen'){data.months[m][p].komitmen[nw]=data.months[m][p].komitmen[old]||{amount:0,nota:'',date:'',time:'',ts:0};delete data.months[m][p].komitmen[old]}if(type==='perbelanjaan'){data.months[m][p].perbelanjaan[nw]=data.months[m][p].perbelanjaan[old]||[];delete data.months[m][p].perbelanjaan[old]}}})}});saveDataNow();showToast(t.msg.updated);renderActiveTab()}
function delC(type,idx){let t=T(),name=data.categories[type][idx];if(!confirm(t.msg.confirmDelCat))return;data.categories[type].splice(idx,1);MONTHS.forEach(m=>{if(data.months[m]){['suami','isteri'].forEach(p=>{if(data.months[m][p]){delete data.months[m][p].komitmen[name];delete data.months[m][p].perbelanjaan[name]}})}});saveDataNow();showToast(t.msg.deleted);renderActiveTab()}

function rExport(){
let el=document.getElementById('tab-eksport');if(!el||!el.classList.contains('active'))return;
let t=T(),X=t.exportTab,CL=t.cloud,SE=t.security,cfg=getFbConfig()||{},hasCfg=!!cfg.databaseURL;
el.innerHTML=`<div class="card"><h2>${X.title} — ${currentMonth}</h2><p style="font-size:.84rem;color:var(--gr3);margin-bottom:16px">${X.desc}</p><div class="export-btn-group"><button class="btn btn-primary" onclick="exCSV()" style="padding:12px 24px">📄 CSV</button><button class="btn btn-primary" onclick="exExcel()" style="padding:12px 24px;background:var(--g1)">📊 Excel</button><button class="btn btn-primary" onclick="exPDF()" style="padding:12px 24px;background:#c62828">📕 PDF</button></div></div>
<div class="cloud-card"><h3>${CL.title}</h3><p style="font-size:.82rem;color:#1565c0;margin-bottom:14px">${CL.desc}</p><div class="cloud-status"><span class="cs-dot ${fbConnected?'online':'offline'}"></span><span style="font-size:.84rem;font-weight:600">${CL.status}: ${hasCfg?(fbConnected?CL.connected:CL.disconnected):CL.notSetup}</span></div>
${hasCfg?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="btn btn-primary btn-sm" onclick="manualSync()">${CL.syncNow}</button><button class="btn btn-outline btn-sm" onclick="pushToCloud()">${CL.pushBtn}</button><button class="btn btn-outline btn-sm" onclick="pullFromCloud()">${CL.pullBtn}</button><button class="btn btn-danger btn-sm" onclick="rmFbCfg()">${CL.removeBtn}</button></div><p style="font-size:.76rem;color:var(--gr3)">DB: ${cfg.databaseURL}</p>`:`<div class="grid-2" style="margin-bottom:10px"><div class="form-group"><label>${CL.urlLabel}</label><input type="text" id="fb_url" value="${cfg.databaseURL||''}" placeholder="${CL.urlPh}"></div><div class="form-group"><label>${CL.keyLabel}</label><input type="text" id="fb_key" value="${cfg.apiKey||''}" placeholder="${CL.keyPh}"></div></div><div class="form-group" style="margin-bottom:14px"><label>${CL.projLabel}</label><input type="text" id="fb_proj" value="${cfg.projectId||''}" placeholder="${CL.projPh}"></div><button class="btn btn-primary" onclick="saveFbCfg()">${CL.saveBtn}</button>`}</div>
<div class="card"><h2>${X.manageTitle}</h2><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn btn-outline" onclick="exJSON()">${X.backup}</button><button class="btn btn-outline" onclick="document.getElementById('impFile').click()">${X.import}</button><input type="file" id="impFile" accept=".json" style="display:none" onchange="impJSON(event)"><button class="btn btn-danger" onclick="resetAll()">${X.resetAll}</button></div></div>
<div class="security-card"><h3>${SE.title}</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="showChangePw()">${SE.changePw}</button><button class="btn btn-outline btn-sm" onclick="lockApp()">${SE.lockNow}</button></div></div>`}

function saveFbCfg(){let url=document.getElementById('fb_url').value.trim(),key=document.getElementById('fb_key').value.trim(),proj=document.getElementById('fb_proj').value.trim();if(!url){showToast('⚠️ URL wajib');return}setFbConfig({databaseURL:url,apiKey:key,projectId:proj});initFirebase();setTimeout(()=>{pushToCloud();renderActiveTab()},1000);showToast('✅ Config disimpan!')}
function rmFbCfg(){if(!confirm('Buang config?'))return;localStorage.removeItem(FB_CONFIG_KEY);if(fbApp)try{fbApp.delete()}catch(e){}fbApp=null;fbDb=null;fbRef=null;fbConnected=false;updateSyncBadge('offline');showToast('🗑️ Dibuang');renderActiveTab()}

function gRows(){let t=T(),hdr=['Who','Type','Category','Amount','Notes','Date','Time'],rows=[hdr];['suami','isteri'].forEach(p=>{let d=data.months[currentMonth]?data.months[currentMonth][p]:null;if(!d)return;let lb=p==='suami'?t.person.suami:t.person.isteri;rows.push([lb,'Income','Salary',d.gaji||0,'-','-','-']);WT_KEYS.forEach((w,i)=>{(d.wangTambahan[w]||[]).forEach(e=>{rows.push([lb,'Extra',wl(i),e.amount,e.nota||'-',e.date||'-',e.time||'-'])})});Object.keys(d.komitmen||{}).forEach(k=>{let obj=migK(d.komitmen[k]);if(obj.amount>0)rows.push([lb,'Commitment',k,obj.amount,obj.nota||'-',obj.date||'-',obj.time||'-'])});Object.keys(d.perbelanjaan||{}).forEach(cat=>{(d.perbelanjaan[cat]||[]).forEach(e=>{rows.push([lb,'Expense',cat,e.amount,e.nota||'-',e.date||'-',e.time||'-'])})})});return rows}
function exCSV(){let rows=gRows(),csv=rows.map(r=>r.map(c=>'"'+(c+'').replace(/"/g,'""')+'"').join(',')).join('\n');dlF(csv,'budget_'+currentMonth+'.csv','text/csv');showToast(T().msg.exported)}
function exExcel(){let rows=gRows(),html='<html><head><meta charset="UTF-8"></head><body><table border="1">';rows.forEach((r,i)=>{html+='<tr>';r.forEach(c=>{html+=(i===0?'<th>':'<td>')+c+(i===0?'</th>':'</td>')});html+='</tr>'});html+='</table></body></html>';dlF(html,'budget_'+currentMonth+'.xls','application/vnd.ms-excel');showToast(T().msg.exported)}
function exPDF(){try{const{jsPDF}=window.jspdf;let doc=new jsPDF('l');doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Budget - '+currentMonth,14,20);let rows=gRows();doc.autoTable({head:[rows[0]],body:rows.slice(1),startY:28,styles:{fontSize:7,cellPadding:3},headStyles:{fillColor:[46,125,50]}});doc.save('budget_'+currentMonth+'.pdf');showToast(T().msg.exported)}catch(e){showToast('⚠️ '+e.message)}}
function dlF(c,f,tp){let b=new Blob([c],{type:tp+';charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;a.click();URL.revokeObjectURL(a.href)}
function exJSON(){dlF(JSON.stringify(data,null,2),'budget_backup.json','application/json');showToast(T().msg.exported)}
function impJSON(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){try{let p=JSON.parse(e.target.result);if(p&&p.months){data=p;if(data.lang)lang=data.lang;saveDataNow();initMonth(currentMonth);setLang(lang);renderActiveTab();pushToCloud();showToast(T().msg.imported)}else showToast(T().msg.invalidFile)}catch(err){showToast(T().msg.invalidFile)}};r.readAsText(f);ev.target.value=''}
function resetAll(){let t=T();if(!confirm(t.msg.confirmReset))return;if(!confirm(t.msg.confirmSure))return;localStorage.removeItem(STORE_KEY);localStorage.removeItem(BACKUP_KEY);data={categories:{komitmen:[...DEF_KOM],perbelanjaan:[...DEF_EXP]},months:{},lang};initMonth(currentMonth);saveDataNow();renderActiveTab();showToast(t.msg.reset)}
function showToast(msg){let x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}

function initApp(){
loadData();
if(!data.categories)data.categories={komitmen:[...DEF_KOM],perbelanjaan:[...DEF_EXP]};
currentMonth=MONTHS[new Date().getMonth()];
initMonth(currentMonth);
document.getElementById('monthSelect').innerHTML=MONTHS.map(m=>`<option value="${m}"${m===currentMonth?' selected':''}>${m}</option>`).join('');
document.getElementById('mainContent').innerHTML=TAB_IDS.map(id=>`<div class="tab-content" id="tab-${id}"></div>`).join('');
document.getElementById('langBM').classList.toggle('active',lang==='bm');
document.getElementById('langEN').classList.toggle('active',lang==='en');
updHeader();buildNav();switchTab('dashboard');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){safeSave();pushToCloud()}});
window.addEventListener('beforeunload',()=>safeSave());
initFirebase();
}

window.addEventListener('DOMContentLoaded',()=>{
let session=getSession(),auth=getAuth();
if(auth&&session&&session.active)enterApp();
else showLoginPage();
});
</script>
</body>
</html>
